      {"id": "politica-coletores", "tipo": "politica", "titulo": "Política Interna — Coletores de Resíduos", "subtitulo": "Segurança, conduta na rota e escala de domingos.", "identificacao": [["Documento", "Política Interna Coletor"], ["Abrangência", "Todas as filiais e marcas do grupo"]], "html": "<p style=\"font-weight:800;color:var(--azul-escuro-2);margin:16px 0 6px;\">🎯  OBJETIVO</p>\n<p>Esta política estabelece as responsabilidades, as normas de segurança e as condutas obrigatórias para os colaboradores que atuam na função de Coletor de Resíduos, com o objetivo de garantir a segurança do próprio colaborador, da equipe e da sociedade durante a operação de coleta.</p>\n<p style=\"font-weight:800;color:var(--azul-escuro-2);margin:16px 0 6px;\">👥  ABRANGÊNCIA</p>\n<p>Esta política se aplica a todos os Coletores de Resíduos da empresa, sejam efetivos, temporários ou substitutos, em qualquer filial ou marca do grupo.</p>\n<p style=\"font-weight:800;color:var(--azul-escuro-2);margin:16px 0 6px;\">🧭  FUNÇÃO E RESPONSABILIDADES</p>\n<p>O Coletor de Resíduos é responsável por recolher resíduos sólidos urbanos nos pontos de coleta, auxiliar na carga e descarga do caminhão e garantir que o processo seja feito com segurança, eficiência e respeito às normas ambientais. Isso inclui:</p>\n<p>Coleta segura: retirar sacos e recipientes de forma correta, evitando acidentes com objetos cortantes ou pesados.</p>\n<p>Limpeza da via: caso um saco se rompa ou os resíduos se espalhem na rua (inclusive por ação de animais), fazer a varrição do local com a vassoura disponível no caminhão, sem deixar sujeira ou resíduos para trás.</p>\n<p>Apoio ao motorista: auxiliar em manobras, sinalizar pontos de parada e manter comunicação clara durante o percurso.</p>\n<p>Cumprimento da rota: seguir os trajetos estabelecidos, garantindo que todos os pontos sejam atendidos.</p>\n<p>Postura profissional: manter pontualidade, respeito à comunidade e trabalho em equipe.</p>\n<p style=\"font-weight:800;color:var(--azul-escuro-2);margin:16px 0 6px;\">🧤  SEGURANÇA E EQUIPAMENTOS</p>\n<p>O uso correto dos Equipamentos de Proteção Individual (EPIs) é obrigatório durante toda a operação:</p>\n<p>Utilizar luvas, botas, uniforme refletivo e máscara sempre durante a operação.</p>\n<p>Adotar postura correta ao levantar sacos e recipientes, evitando lesões.</p>\n<p>Ter cuidado redobrado com objetos cortantes ou perfurantes misturados aos resíduos.</p>\n<p>Manter atenção constante ao tráfego de veículos durante a coleta.</p>\n<p>Em caso de acidente: prestar os primeiros socorros possíveis e comunicar imediatamente o supervisor.</p>\n<p style=\"font-weight:800;color:var(--azul-escuro-2);margin:16px 0 6px;\">🗺️  APOIO AO MOTORISTA E CONDUTA NA ROTA</p>\n<p>Durante o percurso, o coletor deve:</p>\n<p>Auxiliar o motorista em manobras e sinalizar pontos de parada com clareza.</p>\n<p>Manter comunicação constante com o motorista e os demais colegas de equipe.</p>\n<p>Seguir os trajetos e pontos de coleta estabelecidos para a rota.</p>\n<p>Reportar ao supervisor qualquer ponto crítico da rota (ruas estreitas, maior volume de resíduos, horários de pico) que dificulte a operação.</p>\n<p>O reconhecimento da rota é feito na prática, acompanhado por um colega experiente durante o período de acompanhamento no campo — não é ensinado durante a integração no escritório/garagem.</p>\n<p style=\"font-weight:800;color:var(--azul-escuro-2);margin:16px 0 6px;\">🌱  NORMAS AMBIENTAIS DA OPERAÇÃO</p>\n<p>Além dos princípios gerais de responsabilidade ambiental do Código de Conduta e Ética, a operação de coleta exige cuidados específicos:</p>\n<p>Evitar derramamentos de resíduos ou líquidos durante a carga e o transporte.</p>\n<p>Respeitar os locais de descarte definidos (estações de transbordo ou aterros).</p>\n<p>Comunicar ao supervisor qualquer descarte irregular observado na rota.</p>\n<p style=\"font-weight:800;color:var(--azul-escuro-2);margin:16px 0 6px;\">📅  ESCALA DE DOMINGOS (RODÍZIO)</p>\n<p>O serviço de coleta não pode parar, por isso existe um rodízio de domingos entre os colaboradores da empresa.</p>\n<p>A escala varia conforme a filial/cidade e é organizada pelo Encarregado Operacional — não segue um padrão fixo de equipes se revezando semana a semana.</p>\n<p>De forma geral, busca-se que um colaborador só volte a trabalhar em outro domingo depois que os demais colegas também tiverem trabalhado pelo menos uma vez.</p>\n<p>Quem trabalha no domingo recebe folga compensatória em outro dia da semana.</p>\n<p>Em feriados prolongados, pode haver reforço de equipe para evitar acúmulo de resíduos.</p>\n<p>A escala deve ser comunicada ao colaborador com antecedência.</p>\n<p>A ciência desta política é registrada no Termo de Conclusão assinado pelo colaborador ao final do Roteiro de Integração.</p>", "duvidas": "Em caso de dúvidas, entre em contato com o Departamento Pessoal."},

  "html": "<h3>🎯  OBJETIVO</h3>\n<p>Esta política estabelece as regras de condução, os princípios de direção defensiva e as condutas obrigatórias e proibidas para os motoristas de caminhão de coleta de resíduos, com o objetivo de prevenir acidentes, proteger a vida do motorista, dos coletores e de terceiros, preservar a frota e reduzir os custos operacionais decorrentes de sinistros.</p>\n<h3>👥  ABRANGÊNCIA</h3>\n<p>Esta política se aplica a todos os motoristas de caminhão de coleta de resíduos da empresa, sejam efetivos, temporários ou substitutos, em qualquer rota ou turno de operação.</p>\n<h3>🛡️  PRINCÍPIOS DA DIREÇÃO DEFENSIVA</h3>\n<p>A direção defensiva é a forma de conduzir o veículo prevenindo acidentes por meio da aplicação de conhecimentos, atitudes e técnicas que permitem antecipar situações de risco no trânsito. Ela se apoia em cinco elementos, que todo motorista deve exercitar continuamente:</p>\n<p>Conhecimento</p>\n<p>Atenção</p>\n<p>Previsão</p>\n<p>Decisão</p>\n<p>Habilidade</p>\n<h3>🚚  REGRAS GERAIS DE CONDUÇÃO</h3>\n<p>Usar o cinto de segurança durante todo o trajeto, sem exceção.</p>\n<p>Respeitar rigorosamente os limites de velocidade da via e as sinalizações de trânsito.</p>\n<p>Manter distância segura do veículo à frente, ajustando-a às condições da via e do clima.</p>\n<p>Redobrar a atenção em cruzamentos, faixas de pedestres, pontos de ônibus e áreas escolares.</p>\n<p>Sinalizar com antecedência qualquer mudança de faixa, conversão ou manobra.</p>\n<p>Verificar os espelhos retrovisores com frequência e checar os pontos cegos antes de qualquer manobra.</p>\n<p>Reduzir a velocidade em condições adversas (chuva, neblina, pista molhada ou mal iluminada).</p>\n<p>Respeitar os horários de descanso previstos na legislação, evitando dirigir em estado de fadiga ou sonolência.</p>\n<h3>🗑️  REGRAS ESPECÍFICAS DA OPERAÇÃO DE COLETA</h3>\n<p>Limitar a velocidade a, no máximo, 10 km/h durante o deslocamento nas áreas de coleta.</p>\n<p>Aguardar o sinal sonoro do coletor antes de movimentar o veículo.</p>\n<p>Nunca movimentar o veículo em marcha à ré com coletor na plataforma traseira, salvo com sinalização e acompanhamento adequados.</p>\n<p>Permitir a permanência de coletores na plataforma somente com o veículo parado.</p>\n<p>Manter faróis, luz de ré e sinalizadores sonoros de ré em pleno funcionamento.</p>\n<h3>🚫  CONDUTAS PROIBIDAS AO VOLANTE</h3>\n<p>É proibido, durante a condução do veículo:</p>\n<p>Fumar dentro da cabine.</p>\n<p>Utilizar o celular para ligações, mensagens ou redes sociais — inclusive em suporte ou viva-voz — enquanto o veículo estiver em movimento.</p>\n<p>Dirigir sob efeito de álcool ou de qualquer substância que comprometa a atenção, os reflexos ou a capacidade de direção.</p>\n<p>Transportar passageiros ou caronas não autorizadas pela empresa.</p>\n<p>Realizar ultrapassagens indevidas, manobras arriscadas ou disputas de velocidade.</p>\n<p>Deixar o veículo em movimento sem o motorista ao volante.</p>\n<h3>🔧  CHECKLIST DO VEÍCULO PRÉ-OPERAÇÃO</h3>\n<p>Antes de iniciar a rota, o motorista deve realizar a checagem do veículo pelo checklist do aplicativo Praxio, preenchido antes de cada operação. O preenchimento é obrigatório em toda saída para rota. A checagem cobre:</p>\n<p>Componentes elétricos.</p>\n<p>Componentes hidráulicos.</p>\n<p>Componentes mecânicos.</p>\n<div class=\"caixa caixa-atencao\"><span class=\"caixa-icone\">!</span><span>Qualquer irregularidade identificada na checagem deve ser comunicada ao encarregado operacional antes da saída do veículo para a rota — o caminhão não deve operar com item de segurança comprometido.</span></div>\n<h3>🚨  EM CASO DE SINISTRO OU ACIDENTE</h3>\n<p>Em caso de acidente de trânsito envolvendo o veículo, o motorista deve seguir, nesta ordem:</p>\n<p>Manter a calma, parar em local seguro e ligar o pisca-alerta.</p>\n<p>Verificar se há feridos. Havendo, acionar imediatamente o SAMU (192) e, se necessário, a Polícia Militar (190).</p>\n<p>Sinalizar o local do acidente (triângulo, a uma distância segura).</p>\n<p>Fotografar o local, os veículos envolvidos e os danos.</p>\n<p>Anotar os dados do(s) outro(s) motorista(s) e de eventuais testemunhas (nome, telefone, placa).</p>\n<p>Comunicar o acidente imediatamente ao gestor da filial e ao Departamento Pessoal.</p>\n<p>Aguardar as orientações da empresa antes de assumir responsabilidade ou fechar qualquer acordo no local.</p>\n<p>Providenciar o Boletim de Ocorrência quando houver vítima, dano relevante ou exigência legal.</p>\n<h3>💰  RESPONSABILIZAÇÃO FINANCEIRA</h3>\n<p>A apuração de responsabilidade é conduzida internamente pela empresa, mediante análise individual de cada caso, não havendo critério fixo pré-estabelecido para a definição da culpa.</p>\n<p>Constatada a responsabilidade, o valor devido poderá ser cobrado em parcela única ou parcelado, sem limite máximo, sempre observados os limites legais de desconto em folha previstos na legislação trabalhista.</p>\n<p>Danos a terceiros (cobertos pelo seguro da empresa):</p>\n<p>O seguro da empresa cobre apenas danos a terceiros — não cobre danos ao veículo ou equipamento da própria empresa.</p>\n<p>Caso a seguradora resolva o caso diretamente com o terceiro, sem custo adicional para a empresa, não haverá cobrança ao colaborador.</p>\n<p>Caso seja necessário um desembolso adicional para a resolução do caso (por exemplo, quando o terceiro contesta o acordo inicial da seguradora) e seja constatada a culpa, o colaborador arcará com 10% desse valor adicional.</p>\n<p>Danos ou perda de equipamento/veículo da empresa:</p>\n<p>O seguro da empresa não cobre danos ao próprio veículo ou equipamento da frota. Constatada a culpa, o colaborador arcará com 100% do valor do dano ou da perda, ainda que não haja abertura formal de sinistro (por exemplo, a perda de um item do equipamento do caminhão).</p>\n<h3>📱  USO DE EQUIPAMENTO CORPORATIVO (SMARTPHONE)</h3>\n<p>Colaboradores que recebem smartphone corporativo da empresa devem observar as seguintes regras:</p>\n<p>O aparelho destina-se exclusivamente ao desempenho das atividades profissionais, sendo vedado o uso para fins pessoais ou ilícitos.</p>\n<p>O colaborador é responsável pela guarda, pelo uso adequado e pela conservação do aparelho, devendo comunicar imediatamente ao supervisor ou ao Departamento Pessoal qualquer dano, perda, furto ou extravio.</p>\n<p>Danos, perdas ou extravios decorrentes de mau uso ou negligência poderão ser descontados da folha de pagamento do colaborador, respeitando os limites legais previstos na legislação trabalhista.</p>\n<p>É vedada a instalação de aplicativos ou softwares não autorizados pela empresa.</p>\n<p>O colaborador deve manter sigilo das informações corporativas acessadas pelo aparelho, sendo vedado compartilhar senhas ou acessos com terceiros.</p>\n<p>O aparelho deve ser devolvido à empresa ao término do vínculo empregatício ou sempre que solicitado, em condições adequadas de uso, ressalvado o desgaste natural.</p>\n<h3>📅  ESCALA DE DOMINGOS (RODÍZIO)</h3>\n<p>O serviço de coleta não pode parar, por isso existe um rodízio de domingos entre os colaboradores da empresa.</p>\n<p>A escala varia conforme a filial/cidade e é organizada pelo Encarregado Operacional — não segue um padrão fixo de equipes se revezando semana a semana.</p>\n<p>De forma geral, busca-se que um colaborador só volte a trabalhar em outro domingo depois que os demais colegas também tiverem trabalhado pelo menos uma vez.</p>\n<p>Quem trabalha no domingo recebe folga compensatória em outro dia da semana.</p>\n<p>Em feriados prolongados, pode haver reforço de equipe para evitar acúmulo de resíduos.</p>\n<p>A escala deve ser comunicada ao colaborador com antecedência.</p>\n<h3>⚠️  PERMANÊNCIA NA CABINE DURANTE O DESCARREGAMENTO NO ATERRO</h3>\n<p>Durante o descarregamento no aterro sanitário, o motorista deve permanecer na cabine do caminhão. Não é permitido descer da cabine durante o período de descarregamento.</p>",

vre).</p>\n<h3>🔗  QUER SABER MAIS?</h3>\n<p>Este guia cobre o essencial para o uso diário. Para dúvidas mais detalhadas (carteiras digitais, home office, cancelamento etc.), consulte o FAQ completo da Sólides:</p>\n<p><a href=\"https://ajuda.solides.com.br/hc/pt-br/articles/46213728924941-FAQ-Voucher-Troca-de-Cart%C3%B5es-de-Benef%C3%ADcios-e-Atualiza%C3%A7%C3%B5es-de-Funcionalidades\" target=\"_blank\" rel=\"noopener\">FAQ completo da Sólides</a></p>", "documentos": [{"titulo": "Versão para impressão", "descricao": "Documento completo em PDF.", "arquivo": "assets/documentos/primeiro-uso-cartao-alimentacao.pdf?v=20260919", "tipo": "download"}]}]}, {categoria:'Transporte Escolar',guias:[{"id": "boas-vindas-transporte-escolar", "tipo": "politica", "rotulo": "Orientações de integração", "titulo": "Boas-Vindas — Monitores de Transporte Escolar", "subtitulo": "Apresentação, chamada, comunicação e segurança dos alunos.", "identificacao": [["Documento", "Boas-Vindas — Monitores de Transporte Escolar"]], "html": "<p>Se este for o seu primeiro dia como monitora do transporte escolar, seguem algumas orientações importantes para te ajudar nessa nova jornada:</p>\n<h3>👋  APRESENTAÇÃO</h3>\n<p>Apresente-se para as crianças, o motorista e também para os pais ou responsáveis dos alunos. Essa aproximação é essencial para criar um ambiente de confiança e segurança.</p>\n<h3>📝  CHAMADA DOS ALUNOS</h3>\n<p>Com a lista de alunos da sua rota (que foi enviada para você), realize a chamada na ida e na volta. Assim, você garante que todos estejam no veículo e também começa a se familiarizar com os rostinhos das crianças.</p>\n<h3>📱  GRUPO DE WHATSAPP</h3>\n<p>Crie um grupo de WhatsApp com os pais e responsáveis, juntamente com o motorista, para facilitar a comunicação. Utilize o grupo para:</p>\n<p>Enviar avisos e comunicados;</p>\n<p>Permitir que os pais informem faltas ou mudanças;</p>\n<p>Manter uma comunicação rápida e organizada.</p>\n<p>Antes de criar o grupo, verifique com o motorista se ele já possui um grupo ativo da rota para você entrar.</p>\n<h3>🚌  EMBARQUE E DESEMBARQUE</h3>\n<p>Auxilie sempre as crianças ao embarcar e desembarcar do veículo.</p>\n<p>Ajude-as a atravessar a rua com segurança;</p>\n<p>Acompanhe-as até dentro da escola;</p>\n<p>Auxilie com as mochilas e garanta que todas as crianças estejam em segurança.</p>\n<p>💛  Sua função é essencial para garantir a segurança, o cuidado e o bem-estar dos alunos durante o transporte escolar.🎉  Seja muito bem-vinda à equipe!</p>", "documentos": [{"titulo": "Versão para impressão", "descricao": "Documento completo em PDF.", "arquivo": "assets/documentos/boas-vindas-transporte-escolar.pdf?v=20260919", "tipo": "download"}]}]});
CATEGORIAS_DP.push({categoria:'Benefícios — Conferência Interna',guias:[{"id": "criterios-cesta-basica", "tipo": "politica", "rotulo": "Orientação interna", "titulo": "Cesta Básica — Critérios de Apuração", "subtitulo": "Conferência interna do benefício na operação de coleta.", "identificacao": [["Documento", "Cesta Básica — Critérios de Apuração"], ["Público", "Departamento Pessoal e responsáveis administrativos das filiais"], ["Abrangência", "Somente operação de coleta"]], "html": "<h3>🎯  OBJETIVO</h3>\n<p>Este documento reúne, de forma rápida e objetiva, os critérios para saber se o colaborador tem ou não direito à cesta básica no período. É material de apoio para o Departamento Pessoal e para os responsáveis administrativos de cada filial — não deve ser enviado aos colaboradores operacionais.</p>\n<p>Aplica-se apenas à operação de coleta. A cesta básica não é um benefício válido para a Gesta MG (administrativo) nem para a SR Transportes.</p>\n<h3>📅  REGRA GERAL DE APURAÇÃO</h3>\n<p>A cesta básica é apurada junto com a folha de pagamento: sempre do dia 26 do mês anterior até o dia 25 do mês atual. É paga junto com o salário, e quem faz essa conferência todo mês é o responsável administrativo de cada filial.</p>\n<h3>✅  TABELA DE ELEGIBILIDADE</h3><div class=\"tabela-scroll\"><table class=\"tabela-guia\"><thead><tr><th>SITUAÇÃO</th><th>O QUE COMPROVA</th><th>RESULTADO</th></tr></thead><tbody><tr><td>Comparecimento no período (26 a 25), com ou sem justificativa aceita: atestado médico, acidente de trabalho comprovado, óbito de cônjuge ou filho(a), férias, licença legal ou folga já combinada com a liderança.</td><td>Ponto sem ocorrência, ou o documento correspondente (atestado, CAT/laudo, certidão, registro do combinado).</td><td>MANTÉM</td></tr><tr><td>1ª falta no mês para cuidar de dependente (filho, cônjuge ou outro responsável direto) com problema de saúde comprovado, sem atestado do próprio colaborador.</td><td>Laudo, relatório médico ou declaração da escola/serviço de saúde do dependente, em até 5 dias úteis.</td><td>MANTÉM (automático)</td></tr><tr><td>2ª falta ou mais no mesmo mês, pelo mesmo motivo (dependente doente).</td><td>Mesma comprovação acima.</td><td>VAI PARA ANÁLISE DO DP</td></tr><tr><td>Falta sem aviso e sem comprovação, atraso ou saída antes do horário sem autorização.</td><td>Ponto, ou nenhuma comprovação apresentada.</td><td>PERDE</td></tr></tbody></table></div><p>A convenção coletiva não trata falta para cuidar de dependente doente como falta justificada. Mesmo assim, a empresa decidiu conceder esse benefício por conta própria, para qualquer colaborador. Por isso a 1ª ocorrência no mês é automática; da 2ª vez em diante, o caso sobe para análise do Departamento Pessoal. A contagem reinicia a cada mês — usar a falta automática em um mês não conta contra o colaborador no mês seguinte.</p>\n<p>O responsável administrativo da filial decide sozinho, usando a tabela acima. Só sobe para o Departamento Pessoal quando o colaborador repetir a falta por dependente no mesmo mês (2ª vez ou mais), ou quando a situação não se encaixar em nenhuma linha da tabela.</p>"}]});

// Figura com legenda dentro de um passo — usada pelas capturas de tela
// dos sistemas. Imagens ficam em assets/guias/<id-do-guia>/, já
// otimizadas (redimensionadas pro tamanho real de exibição + WebP
// qualidade 92 — sem perda perceptível, ~88% menor que o print cru do
// Word). Clique na imagem abre em tamanho maior (lightbox).
function imgGuia(caminho, legenda) {
  return `<figure class="passo-figura"><img src="${caminho}" alt="${legenda}" onclick="abrirLightbox(this.src, this.alt)"><figcaption>${legenda}</figcaption></figure>`;
}

function abrirLightbox(src, alt) {
  const lb = document.getElementById('lightbox');
  const img = document.getElementById('lightbox-img');
  img.src = src;
  img.alt = alt;
  lb.classList.add('aberto');
}

function fecharLightbox() {
  document.getElementById('lightbox').classList.remove('aberto');
}

const ICONE_DOWNLOAD = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;
const ICONE_FERRAMENTA = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M10 13l-1.5 1.5L10 16"/><path d="M14 13l1.5 1.5L14 16"/></svg>`;

function achaSetor(id) {
  return SETORES.find(s => s.id === id) || null;
}

function achaGuia(id) {
  for (const setor of SETORES) {
    for (const cat of setor.categorias) {
      const g = cat.guias.find(x => x.id === id);
      if (g) return g;
    }
  }
  return null;
}

function achaSetorDoGuia(id) {
  for (const setor of SETORES) {
    for (const cat of setor.categorias) {
      if (cat.guias.some(x => x.id === id)) return setor;
    }
  }
  return null;
}

function achaPastaDoGuia(setor, guiaId) {
  if (!setor || !setor.pastas) return null;
  return setor.pastas.find(pasta => pasta.id === pastaInstitucionalAtual && pasta.guias.some(guia => guia.id === guiaId)) || setor.pastas.find(pasta => pasta.guias.some(guia => guia.id === guiaId)) || null;
}

function tabela2col(linhas, cabecalhos) {
  const th = cabecalhos ? `<tr><th>${cabecalhos[0]}</th><th>${cabecalhos[1]}</th></tr>` : '';
  const tr = linhas.map(([a, b]) => `<tr><td><strong>${a}</strong></td><td>${b}</td></tr>`).join('');
  return `<div class="tabela-scroll"><table class="tabela-guia">${th}${tr}</table></div>`;
}

function tabelaId(linhas) {
  const tr = linhas.map(([a, b]) => `<tr><td class="rotulo">${a}</td><td>${b}</td></tr>`).join('');
  return `<div class="tabela-scroll"><table class="tabela-guia tabela-id">${tr}</table></div>`;
}

function tabelaQuemFaz(linhas) {
  const th = `<tr><th>Responsável / Setor</th><th>Papel no processo</th><th>Quando atua</th></tr>`;
  const tr = linhas.map(([r, p, q]) => `<tr><td><strong>${r}</strong></td><td>${p}</td><td>${q}</td></tr>`).join('');
  return `<div class="tabela-scroll"><table class="tabela-guia">${th}${tr}</table></div>`;
}

// Tela principal de Materiais de Apoio: escolha do setor.
function renderSetores() {
  document.getElementById('header-titulo').textContent = 'Materiais de Apoio';
  document.getElementById('header-sub').textContent = '· Escolha um setor';
  document.getElementById('busca-wrap').classList.remove('ativo');

  const cards = SETORES.map(s => `
    <button class="guia-card setor-card" data-id="${s.id}" onclick="abrirSetor('${s.id}')" type="button">
      <span class="guia-card-icon">${iconeSetor(s.id)}</span>
      <span class="guia-card-corpo">
        <span class="guia-card-titulo">${s.nome}</span>
        <span class="guia-card-sub">${s.descricao}</span>
      </span>
      <span class="guia-card-seta">${ICONE_SETA}</span>
    </button>
  `).join('');

  document.getElementById('main').innerHTML = `
    <div class="indice-intro">
      <h2>Materiais de Apoio</h2>
      <p>Escolha uma área para consultar os materiais disponíveis.</p>
    </div>
    <div class="categoria-grupo">
      <p class="categoria-titulo">Setores</p>
      <div class="guia-lista">${cards}</div>
    </div>
  `;
}

// Índice de guias de um setor específico.
function renderIndice(setorId) {
  const setor = achaSetor(setorId);
  if (!setor) { renderSetores(); return; }

  document.getElementById('header-titulo').textContent = setor.nome;
  document.getElementById('header-sub').textContent = setor.id === 'institucional' ? '· Políticas e treinamentos' : '· Guias de processo';
  document.getElementById('busca-wrap').classList.remove('ativo');

  if (setor.pastas) {
    const pastas = setor.pastas.filter(pasta => !pasta.pai).map(pasta => `
      <button class="guia-card setor-card" onclick="abrirPasta('${setor.id}', '${pasta.id}')" type="button">
        <span class="guia-card-icon">${iconeGuia(pasta.icone)}</span>
        <span class="guia-card-corpo">
          <span class="guia-card-titulo">${pasta.nome}</span>
          <span class="guia-card-sub">${pasta.descricao}</span>
        </span>
        <span class="guia-card-seta">${ICONE_SETA}</span>
      </button>
    `).join('');

    document.getElementById('main').innerHTML = `
      <button class="guia-voltar" onclick="abrirSetores()" type="button">← Voltar aos setores</button>
      <div class="indice-intro">
        <h2>${setor.nome}</h2>
        <p>${setor.descricao}</p>
      </div>
      <div class="pasta-grade">${pastas}</div>
    `;
    return;
  }

  const grupos = setor.categorias.map(cat => {
    const cards = cat.guias.map(g => `
      <button class="guia-card" data-id="${g.id}" onclick="abrirGuia('${g.id}')" type="button">
        <span class="guia-card-icon">${iconeGuia(g.id)}</span>
        <span class="guia-card-corpo">
          <span class="guia-card-titulo">${TITULOS_MENU[g.id] || g.titulo}</span>
          <span class="guia-card-sub">${g.subtitulo}</span>
          ${g.tipo ? `<span class="guia-card-tipo">${g.rotulo || (g.id.startsWith('codigo-conduta') ? 'Código de conduta' : g.tipo === 'politica' ? 'Política interna' : 'Treinamento')}</span>` : ''}
        </span>
        <span class="guia-card-seta">${ICONE_SETA}</span>
      </button>
    `).join('');
    return `
      <div class="categoria-grupo">
        <p class="categoria-titulo">${cat.categoria}</p>
        <div class="guia-lista">${cards}</div>
      </div>
    `;
  }).join('');

  document.getElementById('main').innerHTML = `
    <button class="guia-voltar" onclick="abrirSetores()" type="button">← Voltar aos setores</button>
    <div class="indice-intro">
      <h2>${setor.nome}</h2>
      <p>${setor.descricao}</p>
    </div>
    ${setor.aviso ? `<div class="caixa caixa-atencao" style="margin:0 0 22px;"><span class="caixa-icone">!</span><span>${setor.aviso}</span></div>` : ''}
    ${grupos}
  `;
}

function renderPasta(setorId, pastaId) {
  const setor = achaSetor(setorId);
  const pasta = setor && setor.pastas ? setor.pastas.find(item => item.id === pastaId) : null;
  if (!setor || !pasta) { renderIndice(setorId); return; }

  pastaInstitucionalAtual = pasta.id;
  document.getElementById('header-titulo').textContent = pasta.nome;
  document.getElementById('header-sub').textContent = '· Treinamentos e Políticas';
  document.getElementById('busca-wrap').classList.remove('ativo');

  const subpastas = pasta.subpastas.map(id => setor.pastas.find(p=>p.id===id)).map(p => `<button class="guia-card" type="button" onclick="abrirPasta('${setorId}', '${p.id}')"><span class="guia-card-icon">${iconeGuia(p.icone)}</span><span class="guia-card-corpo"><span class="guia-card-titulo">${p.nome}</span><span class="guia-card-sub">${p.descricao}</span></span><span class="guia-card-seta">${ICONE_SETA}</span></button>`).join('');
  const cards = pasta.guias.map(g => `
    <button class="guia-card" data-id="${g.id}" onclick="abrirGuia('${g.id}')" type="button">
      <span class="guia-card-icon">${iconeGuia(g.id)}</span>
      <span class="guia-card-corpo">
        <span class="guia-card-titulo">${g.id.startsWith('codigo-conduta') ? 'Código de Conduta e Ética' : TITULOS_MENU[g.id] || g.titulo}</span>
        <span class="guia-card-sub">${g.subtitulo}</span>
      </span>
      <span class="guia-card-seta">${ICONE_SETA}</span>
    </button>
  `).join('');

  document.getElementById('main').innerHTML = `
    <button class="guia-voltar" onclick="${pasta.pai ? `abrirPasta('${setorId}', '${pasta.pai}')` : `abrirSetor('${setorId}')`}" type="button">← Voltar para ${pasta.pai ? setor.pastas.find(p=>p.id===pasta.pai).nome : setor.nome}</button>
    <div class="indice-intro">
      <h2>${pasta.nome}</h2>
      <p>${pasta.descricao}</p>
    </div>
    <div class="pasta-grade">${cards}${subpastas}</div>
  `;
}

function atualizarChecklistIntegracao() {
  const itens = [...document.querySelectorAll('.checklist-integracao-item')];
  const concluidos = itens.filter(item => item.checked).length;
  const progresso = document.getElementById('checklist-integracao-progresso');
  const botao = document.getElementById('checklist-integracao-termo');
  const conclusao = botao ? botao.closest('.checklist-conclusao') : null;
  const completo = itens.length > 0 && concluidos === itens.length;

  if (progresso) {
    progresso.textContent = completo
      ? `${concluidos} de ${itens.length} itens concluídos — termo liberado`
      : `${concluidos} de ${itens.length} itens concluídos`;
  }
  if (botao) botao.disabled = !completo;
  if (conclusao) conclusao.classList.toggle('concluido', completo);
}

function abrirTermoIntegracao() {
  const aba = window.open('https://lucas-osorio.github.io/Hub-DP/assets/documentos/roteiro-integracao-termo.pdf?v=20260919', '_blank');
  if (aba) aba.opener = null;
}

function renderGuia(id) {
  const g = achaGuia(id);
  if (!g) { renderSetores(); return; }
  const setor = achaSetorDoGuia(id);
  const pasta = achaPastaDoGuia(setor, id);
  const acaoVoltar = pasta ? `abrirPasta('${setor.id}', '${pasta.id}')` : `abrirIndice('${setor ? setor.id : ''}')`;
  const textoVoltar = pasta ? `Voltar para ${pasta.nome}` : 'Voltar aos guias';

  document.getElementById('header-titulo').textContent = g.titulo;
  document.getElementById('header-sub').textContent = '· ' + (g.rotulo || (g.tipo === 'politica' ? 'Política interna' : g.tipo === 'treinamento' ? 'Treinamento' : 'Guia de processo'));
  document.getElementById('busca-wrap').classList.remove('ativo');

  if (g.tipo === 'politica') {
    const documentosHtmlPol = g.documentos ? g.documentos.map(d => `
      <a class="documento-item" href="${d.arquivo}" target="_blank" rel="noopener">
        <span class="documento-icone">${d.tipo === 'ferramenta' ? ICONE_FERRAMENTA : ICONE_DOWNLOAD}</span>
        <span class="documento-corpo">
          <span class="documento-titulo">${d.titulo}</span>
          <span class="documento-desc">${d.descricao}</span>
        </span>
      </a>
    `).join('') : '';

    document.getElementById('main').innerHTML = `
      <button class="guia-voltar" onclick="${acaoVoltar}" type="button">← ${textoVoltar}</button>

      <div class="guia-header">
        <span class="tag">${g.rotulo || (g.id.startsWith('codigo-conduta') ? 'Código de Conduta' : 'Política Interna')} · ${setor ? setor.nome : ''}</span>
        <h1>${g.titulo}</h1>
        <p>${g.subtitulo}</p>
      </div>

      <div class="secao">
        <p class="secao-titulo">🔎 Identificação</p>
        ${tabelaId(g.identificacao)}
      </div>

      <div class="secao">
        <div class="objetivo-texto politica-interna">${g.html}</div>
      </div>

      ${g.documentos ? `
      <div class="secao">
        <p class="secao-titulo">📎 Documentos e Ferramentas de Apoio</p>
        <div class="documentos-lista">${documentosHtmlPol}</div>
      </div>
      ` : ''}

      ${g.duvidas ? `
      <div class="secao">
        <p class="secao-titulo">❓ Dúvidas ou Problemas?</p>
        <div class="duvidas-card">
          <p style="margin:0;">${g.duvidas}</p>
        </div>
      </div>
      ` : ''}
    `;
    window.scrollTo(0, 0);
    return;
  }

  const passosHtml = g.passos.map(p => `
    <div class="passo">
      <div class="passo-head">
        <span class="passo-numero">${p.numero}</span>
        <span class="passo-head-texto">
          <span class="passo-titulo">${p.titulo}</span>
          <span class="passo-responsavel">Responsável: ${p.responsavel}</span>
        </span>
      </div>
      <div class="passo-corpo">${p.html}</div>
    </div>
  `).join('');

  const anexoLinhas = g.anexo ? g.anexo.linhas.map(item => `
    <tr><td>${item}</td><td class="check">☐</td><td class="check">☐</td></tr>
  `).join('') : '';

  const ocorrenciasHtml = g.ocorrencias ? g.ocorrencias.map(o => `
    <div class="ocorrencia">
      <div class="ocorrencia-head"><span class="ocorrencia-titulo">${o.titulo}</span></div>
      <div class="ocorrencia-corpo">${o.html}</div>
    </div>
  `).join('') : '';

  const documentosHtml = g.documentos ? g.documentos.map(d => `
    <a class="documento-item" href="${d.arquivo}" target="_blank" rel="noopener">
      <span class="documento-icone">${d.tipo === 'ferramenta' ? ICONE_FERRAMENTA : ICONE_DOWNLOAD}</span>
      <span class="documento-corpo">
        <span class="documento-titulo">${d.titulo}</span>
        <span class="documento-desc">${d.descricao}</span>
      </span>
    </a>
  `).join('') : '';

  document.getElementById('main').innerHTML = `
    <button class="guia-voltar" onclick="${acaoVoltar}" type="button">← ${textoVoltar}</button>

    <div class="guia-header">
      <span class="tag">${g.tipo === 'treinamento' ? 'Treinamento' : 'Guia de Processo'} · ${setor ? setor.nome : ''}</span>
      <h1>${g.titulo}</h1>
      <p>${g.subtitulo}</p>
    </div>

    <div class="secao">
      <p class="secao-titulo">🔎 Identificação</p>
      ${tabelaId(g.identificacao)}
    </div>

    <div class="secao">
      <p class="secao-titulo">🎯 Objetivo</p>
      <div class="objetivo-texto">${g.objetivo}</div>
    </div>

    ${g.conceitos?.length ? `
    <div class="secao">
      <p class="secao-titulo">📖 Conceitos Importantes</p>
      ${tabela2col(g.conceitos, ['Termo', 'Definição'])}
    </div>
    ` : ''}

    ${g.simbologia?.length ? `
    <div class="secao">
      <p class="secao-titulo">🔣 Simbologia Utilizada neste Guia</p>
      ${tabela2col(g.simbologia, ['Símbolo', 'Significado'])}
    </div>
    ` : ''}

    ${g.quemFazOQue?.length ? `
    <div class="secao">
      <p class="secao-titulo">👥 Quem Faz o Quê</p>
      ${tabelaQuemFaz(g.quemFazOQue)}
    </div>
    ` : ''}

    <div class="secao">
      <p class="secao-titulo">📋 Passo a Passo</p>
      ${passosHtml}
    </div>

    ${g.ocorrencias ? `
    <div class="secao">
      <p class="secao-titulo">🔧 Ocorrências e Soluções</p>
      ${ocorrenciasHtml}
    </div>
    ` : ''}

    ${g.documentos ? `
    <div class="secao">
      <p class="secao-titulo">📎 Documentos e Ferramentas de Apoio</p>
      <div class="documentos-lista">${documentosHtml}</div>
    </div>
    ` : ''}

    ${g.politicaInterna ? `
    <div class="secao">
      <p class="secao-titulo">📜 ${g.politicaInterna.titulo}</p>
      <div class="objetivo-texto politica-interna">${g.politicaInterna.html}</div>
    </div>
    ` : ''}

    <div class="secao">
      <p class="secao-titulo">❓ Dúvidas ou Problemas?</p>
      <div class="duvidas-card">
        <p style="margin:0;">${g.duvidas}</p>
        <p class="contato">E-mail / ramal: a definir</p>
      </div>
    </div>

    ${g.anexo ? `
    <div class="secao">
      <p class="secao-titulo">📎 ${g.anexo.titulo}</p>
      <div class="anexo-card">
        <p class="desc">${g.anexo.descricao}</p>
        <table class="tabela-guia tabela-checklist">
          <tr><th>Item</th><th>Sim</th><th>Não</th></tr>
          ${anexoLinhas}
        </table>
      </div>
    </div>
    ` : ''}
  `;

  window.scrollTo(0, 0);
}

function abrirSetores() {
  renderSetores();
  history.replaceState(null, '', location.pathname + location.search);
}

function abrirSetor(id) {
  renderIndice(id);
  history.replaceState(null, '', '#' + id);
}

function abrirPasta(setorId, pastaId) {
  renderPasta(setorId, pastaId);
  history.replaceState(null, '', '#' + setorId + '/pasta/' + pastaId);
}

function abrirIndice(setorId) {
  if (!setorId) { abrirSetores(); return; }
  renderIndice(setorId);
  history.replaceState(null, '', '#' + setorId);
}

function abrirGuia(id) {
  renderGuia(id);
  const setor = achaSetorDoGuia(id);
  history.replaceState(null, '', '#' + (setor ? setor.id + '/' : '') + id);
}


// Busca simples: filtra os cards do índice por título/subtítulo/categoria.
document.addEventListener('input', (e) => {
  if (e.target.id !== 'busca') return;
  const termo = e.target.value.trim().toLowerCase();
  document.querySelectorAll('.categoria-grupo').forEach(grupo => {
    let algumVisivel = false;
    grupo.querySelectorAll('.guia-card').forEach(card => {
      const texto = card.textContent.toLowerCase();
      const visivel = !termo || texto.includes(termo);
      card.style.display = visivel ? '' : 'none';
      if (visivel) algumVisivel = true;
    });
    if (grupo.querySelector('.guia-lista')) {
      grupo.style.display = algumVisivel ? '' : 'none';
    }
  });
});

// Chamado pelo Hub (index.html) quando o usuário clica de novo no ícone
// "Materiais de Apoio" no menu lateral, mesmo já estando fundo em um guia —
// funciona como um botão "voltar ao início do módulo", sempre até a escolha
// de setor (a página principal de Materiais de Apoio).
window.hubResetView = function () {
  history.replaceState(null, '', location.pathname + location.search);
  renderSetores();
};

// Inicialização: a URL pode ter #setor, #setor/pasta/id, #setor/guia, ou nada.
const hashInicial = location.hash.replace('#', '');
const partesHash = hashInicial.split('/');
if (partesHash.length === 3 && partesHash[1] === 'pasta') {
  renderPasta(partesHash[0], partesHash[2]);
} else if (hashInicial.includes('/')) {
  const guiaId = partesHash[1];
  if (achaGuia(guiaId)) { renderGuia(guiaId); } else { renderSetores(); }
} else if (hashInicial && achaSetor(hashInicial)) {
  renderIndice(hashInicial);
} else {
  renderSetores();
}
</script>
