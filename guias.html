<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Materiais de Apoio · Guias de Processo — GestaMG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --azul-escuro:#0F4083;
    --azul-escuro-2:#0A2E5C;
    --azul-medio:#2E75B6;
    --azul-claro:#EBF4FD;
    --azul-borda:#9CC2EC;
    --amarelo:#F4B942;
    --amarelo-bg:#FEF3E2;
    --amarelo-borda:#F5CD8A;
    --amarelo-texto:#8A5A00;
    --vermelho:#A32D2D;
    --vermelho-bg:#FCEBEB;
    --vermelho-borda:#F0A5A5;
    --verde:#3B6D11;
    --verde-bg:#EAF3DE;
    --verde-borda:#B9D89A;
    --cinza-50:#FAFBFC;
    --cinza-100:#F5F7FA;
    --cinza-200:#E2E8F0;
    --cinza-400:#8B96A5;
    --cinza-600:#5F6B7A;
    --cinza-900:#202833;
    --texto:#202833;
    --texto-suave:#667385;
    --borda:#E1E7EE;
    --bg:#F5F7FA;
    --raio:12px;
    --raio-sm:8px;
    --sombra-sm:0 1px 3px rgba(30,30,28,.07);
    --sombra-md:0 3px 12px rgba(15,64,131,.10);
    --sombra-lg:0 10px 30px rgba(15,64,131,.16);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Manrope','Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--texto);-webkit-font-smoothing:antialiased;}

  header{
    min-height:68px;
    padding:0 clamp(24px,4vw,48px);
    display:flex;align-items:center;gap:12px;
    background:#fff;color:var(--azul-escuro-2);
    border-bottom:1px solid var(--cinza-200);
    box-shadow:0 1px 2px rgba(30,30,28,.04);
    position:relative;
  }
  header h1{
    margin:0;
    font-family:'Manrope','Segoe UI',Arial,sans-serif;
    font-size:18px;font-weight:700;line-height:1.25;
    letter-spacing:-.015em;text-transform:none;color:var(--azul-escuro-2);
  }
  header .sub{font-size:12.5px;color:var(--texto-suave);font-weight:600;}
  #busca-wrap{margin-left:auto;position:relative;display:none;}
  #busca-wrap.ativo{display:block;}
  #busca{
    width:260px;padding:8px 12px 8px 34px;border-radius:var(--raio-sm);
    border:1.5px solid var(--borda);font-family:inherit;font-size:13px;
    background:var(--cinza-50) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="%236B6A65" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>') no-repeat 10px center;
  }
  #busca:focus{outline:none;border-color:var(--azul-medio);background-color:#fff;}

  main{max-width:980px;margin:0 auto;padding:26px clamp(16px,4vw,48px) 100px;}

  /* ===== Índice de guias ===== */
  .indice-intro{margin:0 0 22px;}
  .indice-intro h2{margin:0 0 6px;font-size:20px;font-weight:800;color:var(--azul-escuro-2);}
  .indice-intro p{margin:0;font-size:13.5px;color:var(--texto-suave);line-height:1.55;max-width:620px;}

  .categoria-grupo{margin:0 0 28px;}
  .categoria-titulo{
    font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
    color:var(--azul-medio);margin:0 0 10px;
  }
  .guia-lista{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;align-items:stretch;}
  .guia-lista .guia-card{height:100%;}
  .pasta-grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
  .pasta-grade .guia-card{height:100%;}
  .guia-card{
    display:flex;align-items:center;gap:14px;
    background:#fff;border:1px solid var(--borda);border-radius:var(--raio);
    padding:16px 18px;box-shadow:var(--sombra-sm);
    cursor:pointer;text-align:left;font-family:inherit;
    transition:box-shadow .15s ease,border-color .15s ease,transform .1s ease;
  }
  .guia-card:hover{box-shadow:var(--sombra-md);border-color:var(--azul-borda);}
  .guia-card:active{transform:scale(.997);}
  .guia-card-icon{
    flex:0 0 auto;width:42px;height:42px;border-radius:10px;
    background:var(--azul-claro);color:var(--azul-escuro);
    display:flex;align-items:center;justify-content:center;
  }
  .guia-card-corpo{flex:1;min-width:0;}
  .guia-card-titulo{display:block;font-size:14.5px;font-weight:700;color:var(--texto);margin-bottom:2px;}
  .guia-card-sub{display:block;font-size:12.5px;color:var(--texto-suave);line-height:1.4;}
  .guia-card-seta{flex:0 0 auto;color:var(--cinza-400);}

  .categoria-em-breve{
    background:var(--cinza-50);border:1px dashed var(--borda);border-radius:var(--raio);
    padding:14px 18px;font-size:12.5px;color:var(--texto-suave);
  }

  /* ===== Página do guia ===== */
  .guia-voltar{
    display:inline-flex;align-items:center;gap:6px;
    background:none;border:0;color:var(--azul-medio);font-weight:700;font-size:13px;
    font-family:inherit;cursor:pointer;padding:6px 0;margin-bottom:14px;
  }
  .guia-voltar:hover{text-decoration:underline;}

  .guia-header{
    background:var(--azul-escuro);color:#fff;border-radius:var(--raio);
    padding:22px 26px;margin-bottom:22px;
    box-shadow:var(--sombra-md);
  }
  .guia-header .tag{
    display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    background:rgba(255,255,255,.14);padding:3px 9px;border-radius:6px;margin-bottom:9px;
  }
  .guia-header h1{margin:0 0 6px;font-size:21px;font-weight:800;letter-spacing:-.01em;}
  .guia-header p{margin:0;font-size:13px;color:rgba(255,255,255,.82);line-height:1.5;max-width:640px;}

  .secao{margin:0 0 26px;}
  .secao-titulo{
    display:flex;align-items:center;gap:8px;
    font-size:14.5px;font-weight:800;color:var(--azul-escuro-2);
    margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid var(--azul-claro);
  }

  table.tabela-guia{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:var(--raio-sm);overflow:hidden;box-shadow:var(--sombra-sm);}
  table.tabela-guia th{
    background:var(--azul-escuro);color:#fff;text-align:left;
    font-size:11px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;
    padding:9px 12px;
  }
  table.tabela-guia td{padding:9px 12px;border-top:1px solid var(--cinza-100);vertical-align:top;line-height:1.5;}
  table.tabela-guia tr:nth-child(even) td{background:var(--cinza-50);}
  table.tabela-id td.rotulo{width:220px;font-weight:700;color:var(--azul-escuro-2);background:var(--azul-claro)!important;}
  .tabela-scroll{width:100%;overflow-x:auto;border-radius:var(--raio-sm);box-shadow:var(--sombra-sm);}
  .tabela-scroll table.tabela-guia{min-width:620px;box-shadow:none;}

  .objetivo-texto{font-size:13.5px;line-height:1.65;color:var(--texto);background:#fff;border:1px solid var(--borda);border-radius:var(--raio);padding:16px 18px;box-shadow:var(--sombra-sm);}

  .passo{background:#fff;border:1px solid var(--borda);border-radius:var(--raio);margin-bottom:14px;box-shadow:var(--sombra-sm);overflow:hidden;}
  .passo-head{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--azul-claro);border-bottom:1px solid var(--azul-borda);}
  .passo-numero{
    flex:0 0 auto;width:30px;height:30px;border-radius:50%;
    background:var(--azul-medio);color:#fff;font-weight:800;font-size:14px;
    display:flex;align-items:center;justify-content:center;
  }
  .passo-head-texto{flex:1;min-width:0;}
  .passo-titulo{display:block;font-size:14px;font-weight:800;color:var(--azul-escuro-2);}
  .passo-responsavel{display:block;font-size:11.5px;font-weight:700;color:var(--azul-medio);margin-top:2px;}
  .passo-corpo,.ocorrencia-corpo{padding:14px 18px 16px;font-size:13.5px;line-height:1.6;}
  .passo-corpo ul,.ocorrencia-corpo ul{margin:0 0 10px;padding-left:20px;}
  .passo-corpo ul:last-child,.ocorrencia-corpo ul:last-child{margin-bottom:0;}
  .passo-corpo li,.ocorrencia-corpo li{margin-bottom:6px;}
  .passo-corpo li:last-child,.ocorrencia-corpo li:last-child{margin-bottom:0;}
  .passo-corpo ul ul,.ocorrencia-corpo ul ul{margin-top:6px;margin-bottom:6px;}
  .passo-corpo strong,.ocorrencia-corpo strong{color:var(--texto);}
  .checklist-integracao{display:flex;flex-direction:column;gap:8px;margin:0;}
  .checklist-item{
    display:flex;align-items:flex-start;gap:10px;padding:10px 12px;
    background:var(--cinza-50);border:1px solid var(--borda);border-radius:var(--raio-sm);
    cursor:pointer;transition:border-color .15s ease,background .15s ease;
  }
  .checklist-item:hover{border-color:var(--azul-borda);background:var(--azul-claro);}
  .checklist-item input{flex:0 0 auto;width:18px;height:18px;margin:1px 0 0;accent-color:var(--azul-medio);cursor:pointer;}
  .checklist-item span{line-height:1.5;transition:color .15s ease,opacity .15s ease;}
  .checklist-item input:checked + span{text-decoration:line-through;color:var(--texto-suave);opacity:.72;}
  .checklist-referencia{margin:8px 0 0 30px!important;}
  .checklist-conclusao{
    margin-top:16px;padding:14px 16px;background:var(--cinza-50);
    border:1px solid var(--borda);border-radius:var(--raio-sm);
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .checklist-conclusao.concluido{background:var(--verde-bg);border-color:var(--verde-borda);}
  .checklist-conclusao-texto{flex:1;min-width:190px;}
  .checklist-conclusao-texto strong{display:block;color:#2E4B0C;}
  .checklist-progresso{display:block;margin-top:2px;font-size:12px;color:var(--verde);font-weight:700;}
  .checklist-termo{
    border:0;border-radius:var(--raio-sm);padding:10px 14px;
    background:var(--azul-escuro);color:#fff;font-family:inherit;font-size:12.5px;font-weight:800;
    cursor:pointer;transition:opacity .15s ease,background .15s ease;
  }
  .checklist-termo:hover:not(:disabled){background:var(--azul-medio);}
  .checklist-termo:disabled{cursor:not-allowed;opacity:.42;}
  .ocorrencia-corpo p{margin:0 0 10px;}
  .ocorrencia-corpo p:last-child{margin-bottom:0;}
  .ocorrencia-corpo p.como{margin:12px 0 8px;font-weight:800;color:var(--azul-escuro-2);}

  .caixa{display:flex;gap:10px;padding:11px 14px;border-radius:var(--raio-sm);margin:10px 0;font-size:12.5px;line-height:1.55;}
  .caixa-icone{flex:0 0 auto;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff;}
  .caixa-atencao{background:var(--amarelo-bg);border:1px solid var(--amarelo-borda);color:var(--amarelo-texto);}
  .caixa-atencao .caixa-icone{background:var(--amarelo);color:#5C3D00;}
  .caixa-pendencia{background:var(--vermelho-bg);border:1px solid var(--vermelho-borda);color:#7A2323;}
  .caixa-pendencia .caixa-icone{background:var(--vermelho);}
  .caixa-exemplo{background:var(--verde-bg);border:1px solid var(--verde-borda);color:#2E4B0C;}
  .caixa-exemplo .caixa-icone{background:var(--verde);}
  .caixa em{font-style:italic;}

  .passo-figura{margin:12px 0;padding:0;}
  .passo-figura img{
    display:block;width:100%;max-width:640px;height:auto;
    border:1px solid var(--borda);border-radius:var(--raio-sm);
    box-shadow:var(--sombra-sm);
    cursor:zoom-in;
  }
  .passo-figura figcaption{
    margin-top:6px;font-size:11.5px;font-style:italic;color:var(--texto-suave);
    max-width:640px;
  }
  .lightbox{
    display:none;position:fixed;inset:0;background:rgba(15,20,30,.82);
    z-index:200;align-items:center;justify-content:center;padding:24px;
    cursor:zoom-out;
  }
  .lightbox.aberto{display:flex;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.4);}

  .ocorrencia{background:#fff;border:1px solid var(--borda);border-radius:var(--raio);margin-bottom:14px;box-shadow:var(--sombra-sm);overflow:hidden;}
  .ocorrencia-head{padding:14px 18px;background:var(--amarelo-bg);border-bottom:1px solid var(--amarelo-borda);}
  .ocorrencia-titulo{font-size:14px;font-weight:800;color:#8A5A00;}

  .duvidas-card{background:#fff;border:1px solid var(--borda);border-radius:var(--raio);padding:16px 18px;box-shadow:var(--sombra-sm);font-size:13.5px;line-height:1.6;}
  .duvidas-card .contato{margin-top:8px;font-weight:700;color:var(--azul-escuro-2);}

  .anexo-card{background:var(--cinza-50);border:1px dashed var(--azul-borda);border-radius:var(--raio);padding:16px 18px;}
  .anexo-card h3{margin:0 0 4px;font-size:13.5px;font-weight:800;color:var(--azul-escuro-2);}
  .anexo-card p.desc{margin:0 0 12px;font-size:12.5px;color:var(--texto-suave);}
  table.tabela-checklist td.check{text-align:center;width:60px;color:var(--cinza-400);font-size:15px;}

  .documentos-lista{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;align-items:stretch;}
  .documentos-lista .documento-item{height:100%;}
  .documento-item{
    display:flex;align-items:center;gap:14px;
    background:#fff;border:1px solid var(--borda);border-radius:var(--raio);
    padding:14px 18px;box-shadow:var(--sombra-sm);
    text-decoration:none;color:inherit;
    transition:box-shadow .15s ease,border-color .15s ease;
  }
  .documento-item:hover{box-shadow:var(--sombra-md);border-color:var(--azul-borda);}
  .documento-icone{
    flex:0 0 auto;width:36px;height:36px;border-radius:8px;
    background:var(--azul-claro);color:var(--azul-escuro);
    display:flex;align-items:center;justify-content:center;
  }
  .documento-corpo{flex:1;min-width:0;}
  .documento-titulo{display:block;font-size:13.5px;font-weight:700;color:var(--texto);}
  .documento-desc{display:block;font-size:12px;color:var(--texto-suave);margin-top:2px;}

  .setor-card .guia-card-icon{width:48px;height:48px;}
  .setor-card .guia-card-titulo{font-size:15.5px;}
  .guia-card-tipo{
    display:inline-flex;margin-top:7px;padding:3px 7px;border-radius:5px;
    background:var(--cinza-100);color:var(--cinza-600);
    font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  }

  .sem-resultado{padding:40px 10px;text-align:center;color:var(--texto-suave);font-size:13.5px;}

  @media (max-width:640px){
    header{min-height:64px;padding:12px 16px;align-items:flex-start;flex-direction:column;gap:2px;}
    header h1{font-size:16px;}
    header .sub{font-size:11.5px;}
    main{padding:20px 14px 72px;}
    #busca-wrap.ativo{display:none;}
    .guia-card{align-items:flex-start;gap:11px;padding:14px;}
    .guia-card-icon{width:38px;height:38px;}
    .setor-card .guia-card-icon{width:42px;height:42px;}
    .guia-card-seta{margin-top:11px;}
    .pasta-grade{grid-template-columns:1fr;}
    .guia-lista,.documentos-lista{grid-template-columns:1fr;}
    .guia-header{padding:18px;margin-bottom:20px;}
    .guia-header h1{font-size:19px;}
    table.tabela-id td.rotulo{width:150px;}
  }
</style>
</head>
<body>

<header>
  <h1 id="header-titulo">Materiais de Apoio</h1>
  <span class="sub" id="header-sub">· Consulte guias, políticas, treinamentos e checklists por setor e empresa</span>
  <div id="busca-wrap">
    <input type="search" id="busca" placeholder="Buscar por processo ou palavra-chave...">
  </div>
</header>

<main id="main">
  <!-- preenchido via JS -->
</main>

<div class="lightbox" id="lightbox" onclick="fecharLightbox()">
  <img id="lightbox-img" src="" alt="">
</div>

<script>
// ============================================================
// GUIAS — cada categoria agrupa um ou mais Guias de Processo.
// Pra adicionar um novo guia: acrescente um objeto dentro de
// "guias" (nova categoria) ou dentro de uma categoria existente.
// Cada guia segue as 8 seções padrão do Guia de Processo Gestamg.
// ============================================================
const CATEGORIAS_DP = [
  {
    categoria: 'Admissão e Contratação',
    guias: [
      {
        id: 'admissao-colaboradores',
        titulo: 'Admissão de Colaboradores',
        subtitulo: "Da requisição da vaga à liberação para o trabalho.",
        identificacao: [
          ['Processo', 'Requisição e Admissão de Colaboradores'],
          ['Responsável principal', 'Departamento Pessoal'],
          ['Quem mais participa', 'Gestor da Área, Diretoria, RH (recrutamento externo), Contabilidade, Financeiro, Assistente Administrativo, Segurança do Trabalho (Suprema), TI'],
          ['Quando acontece', 'Conforme abertura de vaga — nova posição, substituição ou aumento de quadro'],
          ['Sistemas utilizados', 'Domínio, Praxio, eSocial, Hub de Ferramentas DP, Sólides Ponto, Sólides Benefícios, Site Turin, Site Odontoprev, Site Unimed, Site Totalpass, OneDrive'],
          ['Documentos relacionados', 'Requisição de Admissão, Ficha de Admissão, ASO, Termo de Vale-Transporte'],
        ],
        objetivo: 'Este guia orienta os setores envolvidos na execução correta e sequencial do processo de requisição e admissão de colaboradores — da abertura da vaga, com o alinhamento ao RH, até a liberação do colaborador para o trabalho. Cobre a aprovação da contratação, o agendamento do exame admissional, o registro no eSocial, a inclusão de benefícios e o cadastro no controle de ponto. O objetivo é garantir conformidade legal, organização documental e uma boa experiência de chegada para o novo colaborador.',
        conceitos: [
          ['ASO', 'Atestado de Saúde Ocupacional. Documento emitido pelo médico do trabalho após o exame admissional, atestando que o candidato está apto para exercer a função.'],
          ['PGR / PCMSO', 'Programas de Segurança e Medicina do Trabalho que definem riscos, exames ocupacionais e EPIs obrigatórios para cada cargo.'],
          ['eSocial', 'Sistema do Governo Federal para envio unificado de informações trabalhistas e previdenciárias. A admissão deve ser enviada antes do início das atividades do colaborador.'],
          ['Domínio', 'Sistema de gestão utilizado pelo DP e pela Contabilidade para registro e processamento das informações trabalhistas dos colaboradores.'],
          ['Centro de Custo', 'Classificação que define se a vaga será alocada na unidade (filial) ou no espaço administrativo da matriz (Gestamg).'],
          ['Ficha de Admissão', 'Documento padrão preenchido pelo Departamento Pessoal com os dados pessoais, contratuais e funcionais do novo colaborador.'],
          ['Período de Experiência', 'Primeiros 90 dias do contrato de trabalho, divididos em dois ciclos de 45 dias. Ao final, o gestor deve validar a continuidade ou rescisão do contrato.'],
          ['Conta Salário', 'Conta bancária aberta exclusivamente para recebimento de salário, sem cobrança de tarifas para o colaborador.'],
        ],
        simbologia: [
          ['Botão', 'Elemento clicável — botão, link ou ação do sistema.'],
          ['<strong>«Campo»</strong>', 'Campo de preenchimento — insira o valor solicitado.'],
          ['Menu → Submenu', 'Caminho de navegação no sistema.'],
          ['! Atenção', 'Alerta sobre prazo crítico, risco legal ou configuração obrigatória.'],
          ['📎 Anexo', 'Referência a documento de apoio disponível na pasta de Anexos.'],
          ['P Pendência', 'Item que ainda precisa ser criado, definido ou padronizado antes da execução plena da etapa.'],
        ],
        quemFazOQue: [
          ['Gestor da Área', 'Solicita a abertura da vaga, alinha o perfil com o RH, aprova a contratação do candidato final e valida a continuidade ou rescisão ao final do período de experiência.', 'Na abertura da vaga, na aprovação da contratação e ao final do período de experiência.'],
          ['Diretoria', 'Aprova, junto ao Gestor da Área, a abertura da vaga e a contratação do candidato final indicado pelo RH.', 'Na abertura da vaga e na aprovação da contratação.'],
          ['RH (recrutamento externo)', 'Conduz a divulgação da vaga, a triagem de candidatos e as entrevistas, entregando os candidatos finais aprovados para decisão.', 'Durante a fase de recrutamento e seleção.'],
          ['Analista de DP / Departamento Pessoal', 'Coordena todo o processo: valida a requisição, os programas de segurança e a infraestrutura, inclui benefícios, conduz a integração e acompanha o período de experiência.', 'Durante todo o processo.'],

        passos: [
          { numero: 1, titulo: 'Solicitar a Abertura da Vaga e Alinhar com o RH', responsavel: 'Gestor da Área', html: `

            <div class="caixa caixa-atencao"><span class="caixa-icone">!</span><span>As admissões devem respeitar o período de fechamento da folha. Admita, no máximo, até o dia 20 de cada mês.</span></div>
            <div class="caixa caixa-atencao"><span class="caixa-icone">!</span><span>Para motoristas e coletores, a vaga costuma ser preenchida por indicação nas próprias filiais — nesses casos, a etapa de alinhamento com o RH normalmente não se aplica.</span></div>

          { numero: 2, titulo: 'Validar os Programas de Segurança do Trabalho', responsavel: 'Analista de DP', html: `

              </li>
            </ul>
          `},
          { numero: 4, titulo: 'Aprovar a Contratação', responsavel: 'Gestor da Área / Diretoria', html: `

              <li>Autorize formalmente o início do processo de admissão.</li>

          `},
          { numero: 5, titulo: 'Liberar para Admissão', responsavel: 'Departamento Pessoal', html: `
            <ul>
              <li>Confirme a conclusão das seguintes condições antes de encerrar a requisição:

                  <li>Candidato final aprovado pelo Gestor da Área e/ou Diretoria.</li>

          { numero: 6, titulo: 'Agendar o Exame Admissional', responsavel: 'Assistente Administrativo', html: `

          `},
          { numero: 7, titulo: 'Triar e Direcionar os Documentos', responsavel: 'Assistente Administrativo', html: `
            <ul>

                  <li>RG, CPF, comprovante de residência atualizado, título de eleitor e certidão de casamento (quando aplicável).</li>

            <div class="caixa caixa-atencao"><span class="caixa-icone">!</span><span>Prazo: o envio da documentação completa para a Contabilidade deve ocorrer com, no mínimo, 48 horas de antecedência da data de admissão do colaborador. Esse prazo é necessário para que a Contabilidade consiga registrar a admissão e enviar ao eSocial a tempo.</span></div>
          `},
          { numero: 8, titulo: 'Registrar a Admissão no Sistema e Enviar ao eSocial', responsavel: 'Administrativo / Contabilidade / Analista de DP', html: `

            ${imgGuia('assets/guias/admissao-colaboradores/image2.webp', 'Etapa 2 — preenchimento dos dados admissionais.')}
            ${imgGuia('assets/guias/admissao-colaboradores/image3.webp', 'Etapa 3 — sequência do cadastro no portal do cliente.')}
            ${imgGuia('assets/guias/admissao-colaboradores/image4.webp', 'Etapa 4 — finalização do cadastro admissional.')}
            ${imgGuia('assets/guias/admissao-colaboradores/image5.webp', 'Etapa 5 — envio da solicitação ao escritório de contabilidade.')}
            <ul>

              <li>Garanta que a liberação e os documentos admissionais sejam devolvidos ao Departamento Pessoal com, no mínimo, <strong>24 horas de antecedência</strong> da data de admissão.</li>
              <li>Gere os documentos admissionais que necessitam de assinatura do colaborador.</li>

                  <li>DP → DEPARTAMENTO PESSOAL → ADMISSÃO → <strong>«Filial»</strong> → <strong>«Nome do Colaborador»</strong></li>

            <div class="caixa caixa-pendencia"><span class="caixa-icone">P</span><span>Pendência: padronizar quais documentos devem constar no e-mail de encaminhamento para assinatura (ex.: Contrato de Trabalho, Ficha de Admissão, Termo de Vale-Transporte).</span></div>
            <div class="caixa caixa-atencao"><span class="caixa-icone">!</span><span>O registro no Domínio deve ser concluído até 1 dia antes da admissão. O envio ao eSocial deve ocorrer até o final do expediente da data de admissão. O DP cobra o retorno dos documentos assinados.</span></div>
            <div class="caixa caixa-atencao"><span class="caixa-icone">!</span><span>Prazo: a Contabilidade deve devolver a admissão processada — liberação e documentos — ao Departamento Pessoal com, no mínimo, 24 horas de antecedência da data de admissão, garantindo tempo hábil para a coleta de assinaturas antes do primeiro dia do colaborador.</span></div>
          `},
          { numero: 9, titulo: 'Enviar a Ficha de Registro à Segurança do Trabalho', responsavel: 'Departamento Pessoal', html: `
            <ul>
              <li>Envie o relatório de admitidos com nome completo, data de nascimento, CPF e matrícula.</li>
              <li>Envie a ficha de registro do novo colaborador à equipe de Segurança do Trabalho (<strong>Suprema</strong>), responsável pelos programas legais, para inclusão das informações no eSocial.</li>
            </ul>
            <div class="caixa caixa-pendencia"><span class="caixa-icone">P</span><span>Pendência: confirmar e documentar o canal oficial de envio das informações à Suprema (grupo de WhatsApp correto ou outro canal formal).</span></div>
          `},
          { numero: 10, titulo: 'Integrar e Recepcionar o Novo Colaborador', responsavel: 'Departamento Pessoal / Assistente Administrativo', html: `
            <ul>
              <li>Confeccione o card de boas-vindas no <strong>Canva</strong> — modelo disponível no Drive, na pasta Identidade Visual.</li>

              <li>Envie o card apenas ao responsável pela filial — Assistente Administrativo nas filiais ou Gerente na matriz.</li>
              <li>Esse responsável conduz a interação de boas-vindas com a equipe na data de admissão.</li>
              <li>Quando a contratação for feita internamente, elabore o cronograma de integração da semana de admissão, confirmando horários com Frotas, Compras, Financeiro, DP e RH Reserva, e envie por e-mail a todos os participantes com antecedência, com cópia para a Gerente Administrativo.</li>
            </ul>
            <div class="caixa caixa-atencao"><span class="caixa-icone">!</span><span>Quando a contratação for feita através do R&S da Rheserva, a própria Rheserva planeja e acompanha ativamente a integração do colaborador. Nesse caso, o Departamento Pessoal deve apenas acompanhar o processo, sem assumir a elaboração do cronograma.</span></div>
            <ul>
              <li>Ministre o treinamento de integração na data de admissão, seguindo o padrão de integração definido para o tipo de contratação do colaborador (administrativo ou operacional — motorista, coletor etc.).</li>

            </ul>
            <div class="caixa caixa-pendencia"><span class="caixa-icone">P</span><span>Padronizar, em documento próprio dentro desta mesma pasta (guia, política interna ou informativo), a rotina de integração específica para cada tipo de contratação — administrativo, motorista, coletor e demais funções operacionais.</span></div>
          `},
          { numero: 11, titulo: 'Incluir Benefícios', responsavel: 'Departamento Pessoal', html: `
            <ul>
              <li><strong>Vale-Transporte:</strong> se o colaborador optar pelo benefício, cadastre-o no <strong>Domínio</strong> (verba de desconto) e no site da <strong>Turin</strong>.

                  <li>Solicite o cartão e garanta a recarga mensal.</li>
                </ul>
              </li>
              <li><strong>Plano Odontológico (Odontoprev):</strong> cadastre no site da <strong>Odontoprev</strong> os colaboradores administrativos da Gestamg e do SR Transporte com direito ao benefício, até o <strong>dia 25 de cada mês</strong>.
                <ul>
                  <li>Não há desconto para o titular. Ao incluir dependente, aplica-se desconto em folha de R$ 25,17 por dependente.</li>
                </ul>
              </li>
              <li><strong>Plano de Saúde (Unimed):</strong> para cargos administrativos com plano coparticipativo, envie o formulário preenchido até o <strong>dia 25 de cada mês</strong>.
                <ul>
                  <li>Envie via WhatsApp à Unimed — contato Vivian, Comercial de Vendas: 31 98786-7738.</li>
                </ul>
              </li>
              <li><strong>Totalpass:</strong> o colaborador solicita ao DP a inclusão na base de dados.
                <ul>
                  <li>Cadastre-o no site Totalpass (hr.totalpass.com), em Atualizar Base → Incluir Novo Colaborador — o login exige confirmação por e-mail a cada acesso.</li>
                  <li>Oriente o colaborador a baixar o aplicativo Totalpass para validar a inclusão, até o dia 25 de cada mês.</li>
                </ul>
              </li>
            </ul>
            <div class="caixa caixa-atencao"><span class="caixa-icone">!</span><span>Todos os cadastros de benefícios (Odontoprev, Unimed e Totalpass) devem ser realizados no dia 25 de cada mês, sem exceção.</span></div>
          `},
          { numero: 12, titulo: 'Abrir a Conta Salário', responsavel: 'Financeiro', html: `
            <ul>
              <li>Gere o arquivo de abertura de conta no <strong>Domínio Web</strong>: acesse Relatórios → Gerenciador de Relatórios → Diversos, clique em + e selecione Abertura de Conta → Banco do Brasil.</li>
              <li>Preencha as informações da empresa e do novo colaborador.</li>
            </ul>
            ${imgGuia('assets/guias/admissao-colaboradores/image9.webp', 'Gerenciador de relatórios — Domínio Web.')}
            ${imgGuia('assets/guias/admissao-colaboradores/image10.webp', 'Formulário de abertura de conta salário — Banco do Brasil.')}
            <ul>
              <li>Envie o arquivo por e-mail ao Financeiro (fin01@gestamg.com.br).</li>
              <li>No assunto do e-mail, utilize <strong>SEGUE ARQUIVO PARA ABERTURA DE CONTA</strong>; no corpo, descreva nome da empresa, nome do funcionário e data de admissão.</li>
              <li>O Financeiro abre a conta salário do colaborador no banco parceiro, com base nos dados enviados pelo DP.</li>
              <li>Após a confirmação, repasse a informação ao Auxiliar da unidade e à Contabilidade, para cadastro no Domínio.</li>
              <li>No assunto do e-mail, utilize <strong>CONTA E NOME DO FUNCIONÁRIO</strong>; no corpo, inclua os dados da empresa, o nome completo e os dados bancários.</li>
              <li>O Assistente Administrativo comunica o colaborador presencialmente, repassando os dados da conta e orientando-o a validá-la no banco.</li>
            </ul>
            <div class="caixa caixa-pendencia"><span class="caixa-icone">P</span><span>Pendência: criar modelo padrão de e-mail de comunicação dos dados da conta salário ao colaborador.</span></div>
            <div class="caixa caixa-atencao"><span class="caixa-icone">!</span><span>Essa etapa deve ser concluída até o dia 23 de cada mês, para garantir o pagamento do salário no prazo.</span></div>
          `},
          { numero: 13, titulo: 'Cadastrar no Sólides Ponto e no Sólides Benefícios', responsavel: 'Departamento Pessoal', html: `
            <ul>
              <li>Utilize a ferramenta <strong>Cadastro / Fichas</strong> do Hub de Ferramentas DP para gerar as planilhas de importação.</li>
              <li>Envie a(s) Ficha(s) de Admissão do(s) colaborador(es), exportada(s) do Domínio em .xls ou .xlsx — é possível enviar várias de uma vez.</li>
              <li>Confira os dados extraídos automaticamente em cada card. Campo com fundo amarelo veio vazio da ficha — não é erro, é sinal de "confira aqui".</li>
              <li>Preencha e-mail e celular do colaborador — obrigatórios, pois a ficha do Domínio nunca traz e-mail. Sem e-mail próprio, marque a opção de usar o e-mail do DP.</li>
              <li>Gere as planilhas de Ponto e Benefícios — pelos botões individuais ou por "Gerar as 3 planilhas" (inclui também a planilha de EPI).</li>
              <li>No site do Sólides Ponto, no menu lateral, clique em Cadastros Gerais → Colaboradores.</li>
            </ul>
            ${imgGuia('assets/guias/admissao-colaboradores/image11.webp', 'Menu lateral — Cadastros Gerais → Colaboradores.')}
            <ul>
              <li>Na lista de colaboradores, clique em Ações em lote e, em seguida, em Admitir Colaboradores.</li>
            </ul>
            ${imgGuia('assets/guias/admissao-colaboradores/image12.webp', 'Tela de Colaboradores — botão Ações em lote.')}
            <ul>
              <li>Clique em Escolher arquivo e selecione a planilha de Ponto gerada. Escolha a <strong>«Escala»</strong> do(s) colaborador(es) e clique em Processar.</li>
              <li>Confira os dados processados e clique em Admitir para concluir o cadastro.</li>
            </ul>
            ${imgGuia('assets/guias/admissao-colaboradores/image13.webp', 'Tela de Admitir Colaboradores — importação da planilha e confirmação.')}
            <ul>
              <li>Faça login na plataforma portal-beneficios.solides.com.br/login.</li>
              <li>No menu lateral, clique em Colaboradores.</li>
              <li>No canto superior direito, clique em Cadastrar colaborador.</li>
              <li>Clique em Importar planilha.</li>
            </ul>
            ${imgGuia('assets/guias/admissao-colaboradores/image15.webp', 'Opções de cadastro — Importar planilha ou Cadastrar individualmente.')}
            <ul>
              <li>Clique em Selecionar arquivos e suba o arquivo de Benefícios gerado pela ferramenta.</li>
              <li>Clique em Enviar planilha.</li>

              <li>Localize a importação — sempre a primeira da lista — e clique no ícone para ver os detalhes.</li>
              <li>Se a mensagem exibida for "sucesso", a importação foi realizada corretamente.</li>
            </ul>
            ${imgGuia('assets/guias/admissao-colaboradores/image18.webp', 'Mensagem de confirmação da importação.')}
            <ul>
              <li>Após o cadastro, informe ao colaborador o código PIN de acesso à plataforma de ponto e oriente a baixar o aplicativo.</li>

            <div class="caixa caixa-atencao"><span class="caixa-icone">!</span><span>O cartão de benefícios precisa estar em posse do colaborador antes do primeiro pagamento, no 5º dia útil de cada mês.</span></div>
          `},
          { numero: 14, titulo: 'Monitorar o Vencimento do Período de Experiência', responsavel: 'Departamento Pessoal', html: `
            <ul>
              <li>Acompanhe, junto ao Gestor da Área, o vencimento do período de experiência de cada colaborador, para validação da continuidade ou rescisão dentro do prazo.</li>
              <li>Gere mensalmente o relatório de acompanhamento no Domínio Web: navegue até Relatórios → Outros → Avisos de Vencimentos, selecione as empresas e confirme em OK.</li>
              <li>O sistema gera automaticamente o relatório com todos os vencimentos do mês informado.</li>
            </ul>
            ${imgGuia('assets/guias/admissao-colaboradores/image6.webp', 'Geração do relatório de avisos de vencimento no Domínio Web.')}

      "html": "<p>Acesse a <strong>Hub </strong><strong>GestaMG</strong><strong> </strong><strong>Ponto → </strong><strong>Pontos / Dias </strong><strong>Trabalhados</strong></p>\n<p>Arraste o arquivo Excel baixado para a área indicada na ferramenta, ou clique na caixa de seleção para localizá-lo no dispositivo.</p>\n<p>Clique em <strong>Analisar</strong><strong> Pontos</strong> para iniciar o processamento.</p>\n<p>Verifique o resultado exibido para cada colaborador listado:</p>\n<p>Colaboradores com o status <strong>✓ Sem </strong><strong>ocorrências</strong> estão com o ponto em dia — nenhuma ação necessária.</p>\n<p>Colaboradores com ocorrência identificada (ex.: <strong>1× Falta</strong>, <strong>Ponto </strong><strong>em</strong><strong> </strong><strong>aberto</strong>) exigem correção no Sólides.</p>\n<p>Colaboradores com ocorrência de <strong>erro atestado</strong> (evidencia que o atestado foi lançado e o colaborador continua com horas negativas) exigem correção no Sólides.</p>\n<p>Para cada colaborador com ocorrência, clique na <strong>seta de </strong><strong>expansão</strong> para visualizar o detalhamento dia a dia: data, dia da semana, registros, horas trabalhadas, previsto, saldo e tipo da ocorrência detectada.</p>\n<p>Registre os colaboradores e dias que precisam de correção antes de retornar ao Sólides.</p>\n"
    },
    {
      "numero": 3,
      "titulo": "Corrigir as Ocorrências no Sólides",
      "responsavel": "Assistente Administrativo",
      "html": "<p>Acesse o sistema <strong>Sólides</strong> e localize o colaborador com ocorrência identificada.</p>\n<p>Navegue até o dia correspondente à ocorrência detectada na ferramenta.</p>\n<p>Realize a correção adequada conforme o tipo de ocorrência:</p>\n<p><strong>Ponto </strong><strong>em</strong><strong> </strong><strong>aberto</strong><strong> </strong><strong>ou</strong><strong> </strong><strong>não</strong><strong> batido:</strong> realize o ajuste manual do registro.</p>\n<p><strong>Registro </strong><strong>duplicado</strong><strong>:</strong> remova o lançamento incorreto.</p>\n<p><strong>Falta </strong><strong>não</strong><strong> </strong><strong>justificada</strong><strong>:</strong> registre a falta ou vincule o atestado recebido.</p>\n<p><strong>Ponto </strong><strong>em</strong><strong> </strong><strong>atraso</strong><strong>:</strong> oriente o colaborador a realizar o lançamento pelo aplicativo <strong>Sólides</strong> para que o assistente possa aprovar.</p>\n<p><strong>Erro atestado: </strong>verifique se o atestado foi lançado corretamente na aba de afastamentos.</p>\n<p>Repita o processo para todos os colaboradores com ocorrências identificadas.</p>\n<p>Após todas as correções, gere novamente o relatório conforme o Passo 1 e reanalise na ferramenta para confirmar que não há mais ocorrências pendentes.</p>\n<div class=\"caixa caixa-exemplo\"><span class=\"caixa-icone\">i</span><span>O lançamento de ajustes (folga, dobra e outros motivos) está detalhado no GUIA - Lançamento de Ajustes de Ponto; o registro de atestado está no GUIA - Afastamentos.</span></div>\n<button class=\"guia-voltar\" type=\"button\" onclick=\"abrirGuia('lancamento-ajustes-ponto')\">Consultar Lançamento de Ajustes de Ponto →</button>"
    },
    {
      "numero": 4,
      "titulo": "Confirmar o Fechamento da Folha até o Dia 26",
      "responsavel": "Assistente Administrativo",
      "html": "<p>Garanta que, até o <strong>dia</strong><strong> 26 de </strong><strong>cada</strong><strong> </strong><strong>mês</strong>, todos os colaboradores da filial estejam com o ponto 100% correto e sem ocorrências pendentes.</p>\n<p>Realize conferências periódicas — preferencialmente toda <strong>segunda-feira</strong> — para distribuir a carga de trabalho e evitar acúmulo de pendências no prazo final.</p>\n<p>Certifique-se de que o relatório final exportado do <strong>Sólides</strong> reflete fielmente a rotina do período antes de encerrar o fechamento.</p>\n<div class=\"caixa caixa-atencao\"><span class=\"caixa-icone\">!</span><span>O prazo de fechamento do dia 26 é fixo e improrrogável. O relatório exportado do Sólides alimenta diretamente o Domínio para o cálculo da folha de pagamento. Inconsistências no ponto impactam diretamente o pagamento dos colaboradores e cálculo dos valores da alimentação.</span></div>\n"
    }

44c8QwePNjaDgAAAHSKx+PR6dOn9f8Dt/wscKERJxUAAAAASUVORK5CYII=\" alt=\"Tela do Sólides — Preencher e Salvar o Lançamento\" style=\"width:auto;max-width:100%\" onclick=\"abrirLightbox(this.src)\"></figure>\n<p>Tela de lançamento: Motivo, Dia inteiro, datas/horários, Descrição e Anexo.</p>\n<p>Escolha o motivo do ajuste no campo <strong>«Motivo»</strong>.</p>\n<p>Mantenha <strong>«Dia inteiro»</strong> marcado para lançamentos que cobrem o dia todo. Para lançar por intervalo de horário (ex.: 14h às 18h), desmarque essa opção e preencha <strong>«Horário inicial»</strong> e <strong>«Horário final»</strong>.</p>\n<p>Preencha o campo <strong>«Descrição»</strong> com as informações do lançamento.</p>\n<p>Clique em <strong>Salvar</strong>.</p>\n<p><strong>Motivos mais comuns</strong></p>\n<p>O mesmo caminho — <strong>Lançar motivo de ajuste</strong> — é usado para qualquer tipo de ajuste. O que muda, em cada caso, é o motivo escolhido e algumas particularidades, detalhadas abaixo.</p>\n<p><strong>Folga: </strong>selecione o motivo <strong>Folga</strong>, mantenha <strong>«Dia inteiro»</strong> marcado e detalhe, na descrição, o motivo da folga concedida ao colaborador.</p>\n<div class=\"caixa caixa-atencao\"><span class=\"caixa-icone\">!</span><span>Antes de lançar a folga, confirme se o dia foi abonado — ela não pode gerar horas negativas para o colaborador.</span></div>\n<p><strong>Declaração de comparecimento: </strong>selecione o motivo de declaração de comparecimento e informe o período que será abonado de acordo com o documento. </p>\n<p><strong>Dobra: </strong>selecione o motivo <strong>Dia</strong> <strong>Dobra</strong> e faça o lançamento normalmente, mantendo <strong>«Dia inteiro»</strong> marcado.</p>\n<div class=\"caixa caixa-atencao\"><span class=\"caixa-icone\">!</span><span>Mesmo quando o colaborador dobra, ele deve registrar o ponto normalmente nas duas jornadas trabalhadas naquele dia. Isso garante o direito ao cartão alimentação em dobro.</span></div>\n<p><strong>Falta não justificada: </strong>não é necessário fazer esse lançamento — o sistema já reconhece a ocorrência automaticamente como falta.</p>\n<p><strong>Outros motivos (ex.: compensação de banco de horas): </strong>seguem o mesmo caminho descrito no Passo 3, escolhendo o motivo correspondente.</p>\n<div class=\"caixa caixa-atencao\"><span class=\"caixa-icone\">!</span><span>Este caminho vale para qualquer motivo de ajuste, exceto afastamento e cárcere, que têm lançamento próprio e guia específico (GUIA - Afastamentos e GUIA - Cárcere).</span></div>\n<button class=\"guia-voltar\" type=\"button\" onclick=\"abrirGuia('controle-ponto')\">Consultar Controle de Ponto →</button>"

      "responsavel": "Assistente Administrativo",
      "html": "<p>Acesse o sistema Sólides pelo navegador ou aplicativo, utilizando seu login e senha.</p>\n<p>Link direto de login no Sólides: https://app.tangerino.com.br/Tangerino/pages/LoginPage/wicket:pageMapName/wicket-0</p>\n<p>Link direto do Dashboard de Férias no Sólides: https://app.tangerino.com.br/Tangerino/pages/VacationDashboard?funcionalidade=111</p>\n<p>No menu lateral esquerdo, navegue até <strong>Férias → Visão Geral</strong>.</p>\n<p>Utilize o filtro/aba <strong>«Férias a vencer»</strong> para localizar rapidamente os colaboradores com período aquisitivo próximo do vencimento.</p>\n<p>O Dashboard exibirá um resumo das férias dos colaboradores sob sua responsabilidade.</p><figure class=\"passo-figura\"><img src=\"assets/guias/ferias/image2.webp\" alt=\"Menu lateral do Sólides — acesso a Férias → Visão Geral.\" loading=\"lazy\" onclick=\"abrirLightbox(this.src, this.alt)\"><figcaption>Menu lateral do Sólides — acesso a Férias → Visão Geral.</figcaption></figure>"

      "responsavel": "Assistente Administrativo",
      "html": "<p>No canto superior direito, clique em <strong>+ Programar Férias</strong>.</p>\n<p>Use os filtros <strong>«Colaborador»</strong>, <strong>«Filial»</strong> ou <strong>«Local de Trabalho»</strong> para localizar o colaborador desejado.</p>\n<p>Clique em <strong>Programar</strong> ao lado do nome do colaborador.</p><figure class=\"passo-figura\"><img src=\"assets/guias/ferias/image3.webp\" alt=\"Botão + Programar Férias no Dashboard.\" loading=\"lazy\" onclick=\"abrirLightbox(this.src, this.alt)\"><figcaption>Botão + Programar Férias no Dashboard.</figcaption></figure><figure class=\"passo-figura\"><img src=\"assets/guias/ferias/image4.webp\" alt=\"Tela de programação com filtro de colaborador e botão Programar.\" loading=\"lazy\" onclick=\"abrirLightbox(this.src, this.alt)\"><figcaption>Tela de programação com filtro de colaborador e botão Programar.</figcaption></figure>"

      "numero": 3,
      "titulo": "Preencher os Dados da Solicitação",
      "responsavel": "Assistente Administrativo",
      "html": "<p>Na tela de solicitação, preencha os campos obrigatórios:</p>\n<p><strong>«Período trabalhado»</strong>: selecione o intervalo que origina o direito às férias.</p>\n<p><strong>«Data de início»</strong>: informe o primeiro dia de férias do colaborador.</p>\n<p><strong>«Quantidade de dias»</strong>: informe o total de dias de férias.</p>\n<p>Caso o colaborador queira vender parte das férias, marque ☑ Vender alguns dias? e preencha:</p>\n<p><strong>«Número de dias a serem vendidos»</strong>: limite de até 10 dias.</p>\n<p>Selecione se a venda será no início ou no final do período.</p>\n<div class=\"caixa caixa-exemplo\"><span class=\"caixa-icone\">i</span><span>Solicitação original: 30 dias de férias. Dias vendidos: 10 dias ao final do período. Nesse caso: o colaborador gozará 20 dias de férias; as férias iniciarão na data solicitada; o retorno ao trabalho ocorrerá 10 dias antes do fim do período originalmente previsto.</span></div>\n<div class=\"caixa caixa-atencao\"><span class=\"caixa-icone\">!</span><span>A venda de férias está limitada a 1/3 do total de dias (máximo de 10 dias). A posição da venda (início ou final) altera diretamente a data de afastamento e retorno — preencha com atenção.</span></div>\n<p>Clique em <strong>+ Programar</strong> para concluir a solicitação.</p><figure class=\"passo-figura\"><img src=\"assets/guias/ferias/image5.webp\" alt=\"Tela Nova Solicitação com os campos de período, data e quantidade de dias.\" loading=\"lazy\" onclick=\"abrirLightbox(this.src, this.alt)\"><figcaption>Tela Nova Solicitação com os campos de período, data e quantidade de dias.</figcaption></figure>"

    {
      "numero": 5,
      "titulo": "Solicitar o Cálculo de Férias no Portal Onvio",
      "responsavel": "Assistente Administrativo",
      "html": "<div class=\"caixa caixa-atencao\"><span class=\"caixa-icone\">!</span><span>Este passo deve ser feito depois do Passo 4 (solicitação lançada no Sólides), mas não é necessário aguardar a aprovação dessa solicitação para iniciar a solicitação no Onvio.</span></div>\n<p>Após lançar a solicitação no Sólides (Passo 4), acesse também o Portal Cliente da Onvio — sistema utilizado pela Contabilidade para apurar oficialmente os valores devidos ao colaborador — e registre o pedido de cálculo de férias correspondente.</p>\n<p>Link direto do Portal do Cliente Onvio: https://onvio.com.br/clientcenter/pt/auth?r=%2Fhome</p>\n<p>Acesse o portal utilizando as credenciais cadastradas para a sua unidade.</p>\n<p>Informe seu <strong>«E-mail»</strong> e, em seguida, sua <strong>«Senha»</strong> para concluir o login na plataforma.</p>\n<p>Clique na aba Portal do Cliente para acessar o ambiente de solicitações.</p>\n<p>Selecione o ícone Cálculo de Férias no menu principal do portal.</p>\n<p>Clique em + Adicionar para abrir uma nova solicitação de cálculo.</p>\n<p>Selecione, no campo <strong>«Empregado»</strong>, o colaborador desejado e preencha as informações solicitadas na tela:</p>\n<p><strong>«Data de início de gozo»</strong>: informe a data em que as férias terão início.</p>\n<p><strong>«Dias de gozo»</strong>: informe a quantidade de dias de descanso.</p>\n<p><strong>«Pagar abono pecuniário»</strong>: selecione, se aplicável, caso o colaborador opte por vender parte das férias.</p>\n<p><strong>«Adiantar 1ª parcela do 13º»</strong>: selecione, se aplicável, caso haja adiantamento do 13º salário.</p>\n<p><strong>«Assunto»</strong> e <strong>«Descrição»</strong> conforme o padrão abaixo, garantindo que a Contabilidade identifique rapidamente o colaborador e a natureza da solicitação.</p>\n<div class=\"caixa caixa-exemplo\"><span class=\"caixa-icone\">i</span><span>Assunto: nome completo do colaborador. Descrição: “Solicito o cálculo de férias do funcionário <strong>«Nome completo do colaborador»</strong>”.</span></div>\n<p>No canto superior direito, clique em <strong>Adicionar</strong> para confirmar o envio. Antes de concluir, revise novamente todas as informações preenchidas.</p>\n<div class=\"caixa caixa-atencao\"><span class=\"caixa-icone\">!</span><span>Caso ocorra qualquer mudança no cronograma já enviado, entre em contato com o Departamento Pessoal central e solicite o cancelamento da solicitação. Após o cancelamento, ajuste a programação tanto no Sólides quanto na solicitação da Onvio.</span></div>\n<div class=\"caixa caixa-atencao\"><span class=\"caixa-icone\">!</span><span>O cadastro no Onvio é feito por unidade, e o acesso à plataforma é restrito ao administrativo responsável pelo contrato daquela unidade.</span></div>\n<div class=\"caixa caixa-atencao\"><span class=\"caixa-icone\">!</span><span>Envie a solicitação de cálculo com, no mínimo, 10 dias de antecedência do vencimento das férias, garantindo tempo hábil para o Financeiro processar o pagamento.</span></div><figure class=\"passo-figura\"><img src=\"assets/guias/ferias/image9.webp\" alt=\"Tela inicial do Portal do Cliente Onvio.\" loading=\"lazy\" onclick=\"abrirLightbox(this.src, this.alt)\"><figcaption>Tela inicial do Portal do Cliente Onvio.</figcaption></figure><figure class=\"passo-figura\"><img src=\"assets/guias/ferias/image10.webp\" alt=\"Campo de E-mail para login no Portal do Cliente.\" loading=\"lazy\" onclick=\"abrirLightbox(this.src, this.alt)\"><figcaption>Campo de E-mail para login no Portal do Cliente.</figcaption></figure><figure class=\"passo-figura\"><img src=\"assets/guias/ferias/image11.webp\" alt=\"Campo de Senha para login no Portal do Cliente.\" loading=\"lazy\" onclick=\"abrirLightbox(this.src, this.alt)\"><figcaption>Campo de Senha para login no Portal do Cliente.</figcaption></figure><figure class=\"passo-figura\"><img src=\"assets/guias/ferias/image12.webp\" alt=\"Abas do portal — Início, Documentos e Portal do Cliente.\" loading=\"lazy\" onclick=\"abrirLightbox(this.src, this.alt)\"><figcaption>Abas do portal — Início, Documentos e Portal do Cliente.</figcaption></figure><figure class=\"passo-figura\"><img src=\"assets/guias/ferias/image13.webp\" alt=\"Cartões do Portal do Cliente, incluindo o ícone Cálculo de Férias.\" loading=\"lazy\" onclick=\"abrirLightbox(this.src, this.alt)\"><figcaption>Cartões do Portal do Cliente, incluindo o ícone Cálculo de Férias.</figcaption></figure><figure class=\"passo-figura\"><img src=\"assets/guias/ferias/image14.webp\" alt=\"Barra de ações da tela Solicitações de Cálculo de Férias, com o botão Adicionar.\" loading=\"lazy\" onclick=\"abrirLightbox(this.src, this.alt)\"><figcaption>Barra de ações da tela Solicitações de Cálculo de Férias, com o botão Adicionar.</figcaption></figure><figure class=\"passo-figura\"><img src=\"assets/guias/ferias/image15.webp\" alt=\"Formulário de nova solicitação — Empregado, datas, dias de gozo e opções de abono/13º.\" loading=\"lazy\" onclick=\"abrirLightbox(this.src, this.alt)\"><figcaption>Formulário de nova solicitação — Empregado, datas, dias de gozo e opções de abono/13º.</figcaption></figure><figure class=\"passo-figura\"><img src=\"assets/guias/ferias/image16.webp\" alt=\"Campos Assunto e Descrição da solicitação.\" loading=\"lazy\" onclick=\"abrirLightbox(this.src, this.alt)\"><figcaption>Campos Assunto e Descrição da solicitação.</figcaption></figure><figure class=\"passo-figura\"><img src=\"assets/guias/ferias/image17.webp\" alt=\"Botões Adicionar e Cancelar para confirmar o envio.\" loading=\"lazy\" onclick=\"abrirLightbox(this.src, this.alt)\"><figcaption>Botões Adicionar e Cancelar para confirmar o envio.</figcaption></figure><figure class=\"passo-figura\"><img src=\"assets/guias/ferias/image18.webp\" alt=\"Tela de Solicitações de Cálculo de Férias após o envio.\" loading=\"lazy\" onclick=\"abrirLightbox(this.src, this.alt)\"><figcaption>Tela de Solicitações de Cálculo de Férias após o envio.</figcaption></figure>"

      "responsavel": "Assistente Administrativo",
      "html": "<p>Solicite qualquer remanejamento de férias com, no mínimo, 30 dias de antecedência, evitando impacto nos fluxos das demais áreas envolvidas.</p>\n<p>Atualize a nova data no Sólides e na Onvio.</p>\n<p>Justifique o motivo do remanejamento por e-mail ao Departamento Pessoal.</p>\n<div class=\"caixa caixa-atencao\"><span class=\"caixa-icone\">!</span><span>Por determinação legal, as férias podem ser fracionadas em até três períodos, desde que um deles tenha, no mínimo, 14 dias corridos e os demais, no mínimo, 5 dias cada. Além disso, as férias não podem iniciar às sextas-feiras nem nos dois dias que antecedem feriado ou DSR — a única exceção é iniciar na quinta-feira, desde que sexta-feira e sábado não sejam feriados.</span></div>"

      "html": "<p>O saldo de férias é calculado com base na data de admissão e nos eventos de afastamento e gozo registrados. Quando o saldo aparece incorreto, é necessário reprocessar para forçar uma nova contagem.</p>\n<p>Como resolver:</p>\n<p>Acesse Cadastros gerais → Colaboradores.</p>\n<p>Clique no ícone de edição (lápis) ao lado do colaborador.</p>\n<p>Altere a data de admissão para o dia anterior à data atual e salve.</p>\n<div class=\"caixa caixa-exemplo\"><span class=\"caixa-icone\">i</span><span>Data de admissão original: 05/05/2025. Altere temporariamente para 04/05/2025 (dia anterior) e salve. Em seguida, retorne para a data original — 05/05/2025 — e salve novamente.</span></div>\n<p>Depois, retorne à data correta original e salve.</p>\n<p>Verifique novamente o saldo.</p>"

            <p style="font-weight:800;color:var(--azul-escuro-2);margin:16px 0 6px;">1. Por que fazemos isso</p>
            <p>Dirigir sob efeito de álcool é uma das principais causas de acidentes graves no trânsito. Como empresa de transportes, temos a responsabilidade de garantir que nossos motoristas estejam em condições seguras para exercer sua função.</p>
            <p>O programa de bafômetro não é uma medida punitiva nem uma demonstração de desconfiança. É uma ação preventiva que protege o próprio colaborador, seus colegas e todas as pessoas que dependem do nosso trabalho.</p>

function politicaMotoristasHtml(percentual) {
  return `
    <p style="font-weight:800;color:var(--azul-escuro-2);margin:0 0 6px;">Objetivo</p>
    <p>Esta política estabelece as regras de condução, os princípios de direção defensiva e as condutas obrigatórias e proibidas para os motoristas de caminhão de coleta de resíduos, com o objetivo de prevenir acidentes, proteger a vida do motorista, dos coletores e de terceiros, preservar a frota e reduzir os custos operacionais decorrentes de sinistros.</p>

    <p style="font-weight:800;color:var(--azul-escuro-2);margin:16px 0 6px;">Abrangência</p>
    <p>Esta política se aplica a todos os motoristas de caminhão de coleta de resíduos da empresa, sejam efetivos, temporários ou substitutos, em qualquer rota ou turno de operação.</p>

    <p style="font-weight:800;color:var(--azul-escuro-2);margin:16px 0 6px;">Princípios da Direção Defensiva</p>
    <p>A direção defensiva é a forma de conduzir o veículo prevenindo acidentes por meio da aplicação de conhecimentos, atitudes e técnicas que permitem antecipar situações de risco no trânsito. Ela se apoia em cinco elementos, que todo motorista deve exercitar continuamente:</p>
    <table class="tabela-guia" style="margin:10px 0;"><tr><td>Conhecimento</td><td>Atenção</td></tr><tr><td>Previsão</td><td>Decisão</td></tr><tr><td>Habilidade</td><td></td></tr></table>

    <p style="font-weight:800;color:var(--azul-escuro-2);margin:16px 0 6px;">Regras Gerais de Condução</p>
    <ul><li>Usar o cinto de segurança durante todo o trajeto, sem exceção.</li><li>Respeitar rigorosamente os limites de velocidade da via e as sinalizações de trânsito.</li><li>Manter distância segura do veículo à frente, ajustando-a às condições da via e do clima.</li><li>Redobrar a atenção em cruzamentos, faixas de pedestres, pontos de ônibus e áreas escolares.</li><li>Sinalizar com antecedência qualquer mudança de faixa, conversão ou manobra.</li><li>Verificar os espelhos retrovisores com frequência e checar os pontos cegos antes de qualquer manobra.</li><li>Reduzir a velocidade em condições adversas (chuva, neblina, pista molhada ou mal iluminada).</li><li>Respeitar os horários de descanso previstos na legislação, evitando dirigir em estado de fadiga ou sonolência.</li></ul>

    <p style="font-weight:800;color:var(--azul-escuro-2);margin:16px 0 6px;">Regras Específicas da Operação de Coleta</p>
    <ul><li>Limitar a velocidade a, no máximo, 10 km/h durante o deslocamento nas áreas de coleta.</li><li>Aguardar o sinal sonoro do coletor antes de movimentar o veículo.</li><li>Nunca movimentar o veículo em marcha à ré com coletor na plataforma traseira, salvo com sinalização e acompanhamento adequados.</li><li>Permitir a permanência de coletores na plataforma somente com o veículo parado.</li><li>Manter faróis, luz de ré e sinalizadores sonoros de ré em pleno funcionamento.</li></ul>

    <p style="font-weight:800;color:var(--azul-escuro-2);margin:16px 0 6px;">Condutas Proibidas ao Volante</p>
    <p>É proibido, durante a condução do veículo:</p>
    <ul><li>Fumar dentro da cabine.</li><li>Utilizar o celular para ligações, mensagens ou redes sociais — inclusive em suporte ou viva-voz — enquanto o veículo estiver em movimento.</li><li>Dirigir sob efeito de álcool ou de qualquer substância que comprometa a atenção, os reflexos ou a capacidade de direção.</li><li>Transportar passageiros ou caronas não autorizadas pela empresa.</li><li>Realizar ultrapassagens indevidas, manobras arriscadas ou disputas de velocidade.</li><li>Deixar o veículo em movimento sem o motorista ao volante.</li></ul>

    <p style="font-weight:800;color:var(--azul-escuro-2);margin:16px 0 6px;">Checagem do Veículo (Pré-Operação)</p>
    <p>Antes de iniciar a rota, o motorista deve verificar:</p>
    <ul><li>Freios, pneus (calibragem e desgaste) e sistema de suspensão.</li><li>Faróis, lanternas, setas, luz de ré e sinalizador sonoro de ré.</li><li>Espelhos retrovisores e limpadores de para-brisa.</li><li>Níveis de óleo, água e combustível.</li><li>Sistema de carregamento — roldanas, cabos, travas do contêiner e alavancas de comando.</li><li>Presença e validade do extintor de incêndio e do triângulo de sinalização.</li></ul>
    <div class="caixa caixa-atencao"><span class="caixa-icone">!</span><span>Qualquer irregularidade identificada na checagem deve ser comunicada ao responsável pela filial antes da saída do veículo para a rota — o caminhão não deve operar com item de segurança comprometido.</span></div>

    <p style="font-weight:800;color:var(--azul-escuro-2);margin:16px 0 6px;">Em Caso de Sinistro ou Acidente</p>
    <p>Em caso de acidente de trânsito envolvendo o veículo, o motorista deve seguir, nesta ordem:</p>
    <ol><li>Manter a calma, parar em local seguro e ligar o pisca-alerta.</li><li>Verificar se há feridos. Havendo, acionar imediatamente o SAMU (192) e, se necessário, a Polícia Militar (190).</li><li>Sinalizar o local do acidente (triângulo, a uma distância segura).</li><li>Fotografar o local, os veículos envolvidos e os danos.</li><li>Anotar os dados do(s) outro(s) motorista(s) e de eventuais testemunhas (nome, telefone, placa).</li><li>Comunicar o acidente imediatamente ao gestor da filial e ao Departamento Pessoal.</li><li>Aguardar as orientações da empresa antes de assumir responsabilidade ou fechar qualquer acordo no local.</li><li>Providenciar o Boletim de Ocorrência quando houver vítima, dano relevante ou exigência legal.</li></ol>

    <p style="font-weight:800;color:var(--azul-escuro-2);margin:16px 0 6px;">Responsabilização Financeira</p>
    <p>A apuração de responsabilidade é conduzida internamente pela empresa, mediante análise individual de cada caso, não havendo critério fixo pré-estabelecido para a definição da culpa.</p>
    <p>Constatada a responsabilidade, o valor devido poderá ser cobrado em parcela única ou parcelado, sem limite máximo, sempre observados os limites legais de desconto em folha previstos na legislação trabalhista.</p>
    <p><strong>Danos a terceiros (cobertos pelo seguro da empresa):</strong></p>
    <ul><li>O seguro da empresa cobre apenas danos a terceiros — não cobre danos ao veículo ou equipamento da própria empresa.</li><li>Caso a seguradora resolva o caso diretamente com o terceiro, sem custo adicional para a empresa, não haverá cobrança ao colaborador.</li><li>Caso seja necessário um desembolso adicional para a resolução do caso (por exemplo, quando o terceiro contesta o acordo inicial da seguradora) e seja constatada a culpa, o colaborador arcará com ${percentual} desse valor adicional.</li></ul>
    <p><strong>Danos ou perda de equipamento/veículo da empresa:</strong></p>
    <ul><li>O seguro da empresa não cobre danos ao próprio veículo ou equipamento da frota.</li><li>Constatada a culpa, o colaborador arcará com 100% do valor do dano ou da perda, ainda que não haja abertura formal de sinistro (por exemplo, a perda de um item do equipamento do caminhão).</li></ul>

    <p style="font-weight:800;color:var(--azul-escuro-2);margin:16px 0 6px;">Uso de Equipamento Corporativo (Smartphone)</p>
    <p>Colaboradores que recebem smartphone corporativo da empresa devem observar as seguintes regras:</p>
    <ul><li>O aparelho destina-se exclusivamente ao desempenho das atividades profissionais, sendo vedado o uso para fins pessoais ou ilícitos.</li><li>O colaborador é responsável pela guarda, pelo uso adequado e pela conservação do aparelho, devendo comunicar imediatamente ao supervisor ou ao Departamento Pessoal qualquer dano, perda, furto ou extravio.</li><li>Danos, perdas ou extravios decorrentes de mau uso ou negligência poderão ser descontados da folha de pagamento do colaborador, respeitando os limites legais previstos na legislação trabalhista.</li><li>É vedada a instalação de aplicativos ou softwares não autorizados pela empresa.</li><li>O colaborador deve manter sigilo das informações corporativas acessadas pelo aparelho, sendo vedado compartilhar senhas ou acessos com terceiros.</li><li>O aparelho deve ser devolvido à empresa ao término do vínculo empregatício ou sempre que solicitado, em condições adequadas de uso, ressalvado o desgaste natural.</li></ul>
    <p style="font-weight:800;color:var(--azul-escuro-2);margin:16px 0 6px;">Escala de Domingos (Rodízio)</p>
    <p>O serviço de coleta não pode parar, por isso existe um rodízio de domingos entre os colaboradores da empresa.</p>
    <ul><li>A escala varia conforme a filial/cidade e é organizada pelo Encarregado Operacional — não segue um padrão fixo de equipes se revezando semana a semana.</li><li>De forma geral, busca-se que um colaborador só volte a trabalhar em outro domingo depois que os demais colegas também tiverem trabalhado pelo menos uma vez.</li><li>Quem trabalha no domingo recebe folga compensatória em outro dia da semana.</li><li>Em feriados prolongados, pode haver reforço de equipe para evitar acúmulo de resíduos.</li><li>A escala deve ser comunicada ao colaborador com antecedência.</li></ul>
  `;
}

  "html": "<h3>🎯  OBJETIVO</h3>\n<p>Esta política estabelece as normas de conduta, atendimento, pontualidade e segurança para os motoristas de transporte urbano de passageiros da SR Transportes, com o objetivo de garantir a qualidade do serviço, o cumprimento das exigências da fiscalização municipal e o respeito aos passageiros.</p>\n<h3>👥  ABRANGÊNCIA</h3>\n<p>Esta política se aplica a todos os motoristas de ônibus da SR Transportes, efetivos, temporários ou substitutos, em qualquer linha ou turno de operação.</p>\n<h3>🚌  PERÍODO DE INTEGRAÇÃO E ACOMPANHAMENTO</h3>\n<p>Acompanhamento inicial (3 a 5 dias): Antes de assumir a operação individual, o novo motorista passa por um período de avaliação prática acompanhado do gestor responsável e de motoristas parceiros mais experientes.</p>\n<p>Avaliação contínua: São avaliados o cumprimento de horários, a postura profissional, a atenção às normas de trânsito e o manuseio adequado do veículo.</p>\n<p>Primeira viagem solo: No primeiro dia rodando sozinho, o gestor está presente no início do turno para prestar suporte e orientações finais.</p>\n<h3>🙋  EXCELÊNCIA E PRIORIDADE NO ATENDIMENTO</h3>\n<p>Prioridade absoluta: Garantir embarque e desembarque seguros, com paciência e total atenção a idosos, gestantes, pessoas com deficiência e pessoas com mobilidade reduzida.</p>\n<p>Postura e respeito: Tratar todos os passageiros com urbanidade, cortesia e profissionalismo. Dúvidas sobre itinerários devem ser respondidas com clareza.</p>\n<p>Segurança dos passageiros: Aguardar o desembarque ou a acomodação completa dos passageiros prioritários antes de dar a partida.</p>\n<h3>⏰  PONTUALIDADE, ESCALAS E RETORNO DE FOLGA</h3>\n<p>Cumprimento rigoroso de horário: A pontualidade nos pontos de partida e nos itinerários é monitorada diretamente pela prefeitura e pela fiscalização interna.</p>\n<div class=\"caixa caixa-atencao\"><span class=\"caixa-icone\">!</span><span>Atenção — retorno pós-folga:  o motorista que esteve de folga no dia anterior retorna para a garagem impreterivelmente no segundo horário (08h20, para saída às 09h00). O motorista parceiro da linha é responsável por cobrir o primeiro horário (05h30). É obrigação de ambos confirmarem previamente a escala do dia seguinte, para evitar faltas ou atrasos na linha.</span></div>\n<p>Apresentação de atestado médico: Deve ser apresentado ao Departamento Pessoal em até 48 horas a partir da data do afastamento, ou enviado pelo WhatsApp o quanto antes — para que a escala do dia seja reorganizada sem prejuízo à linha.</p>\n<h3>💰  PROGRAMA DE INCENTIVOS FINANCEIROS</h3>\n<p>Premiações mensais por desempenho:</p>\n<p>Bônus de Assiduidade e Pontualidade (R$ 120,00): Concedido ao motorista que cumpre integralmente os horários da escala, sem atrasos, faltas ou saídas adiantadas.</p>\n<p>Bônus de Postura e Boa Conduta (R$ 150,00): Destinado aos profissionais sem registros de reclamações na ouvidoria, advertências ou infrações operacionais.</p>\n<h3>🔀  PROTOCOLO DE DESVIO DE ROTA EM TEMPO REAL</h3>\n<p>Desvios só são autorizados em casos imprevistos (vias interditadas, acidentes, velórios ou socorro do SAMU). Siga o procedimento:</p>\n<p>1. Parar o veículo em local seguro assim que identificar o bloqueio na via.</p>\n<p>2. Registrar foto ou vídeo do obstáculo, de preferência enquadrando a placa com o nome da rua.</p>\n<p>3. Enviar a comprovação imediatamente via WhatsApp para o Gestor de Logística.</p>\n<p>4. O Gestor informará em tempo real a Fiscalização de Trânsito, o Engenheiro e a Secretaria de Trânsito para validação do desvio.</p>\n<h3>⚠️  MEDIDAS DISCIPLINARES E FISCALIZAÇÃO</h3>\n<p>Atrasos / falhas de comunicação: O descumprimento de horários ou erros de escala acarretam a perda imediata dos bônus mensais (R$ 120,00 e R$ 150,00), além de advertência formal no prontuário.</p>\n<p>Sinistros e avarias: Em caso de colisão ou danos ao veículo decorrentes de imprudência ou negligência, o motorista arca com o valor da franquia do seguro.</p>\n<p>Fiscalização e bafômetro: A empresa realiza fiscalizações periódicas e testes aleatórios de bafômetro. O cumprimento é obrigatório.</p>\n<p>Reclamações na ouvidoria: Queixas diretas da população ou da prefeitura são apuradas imediatamente para a tomada de providências cabíveis.</p>",

  "html": "<h3>🎯  OBJETIVO</h3>\n<p>Esta política reúne, de forma organizada e centralizada, as normas práticas do dia a dia administrativo da Gestamg: como funcionam o uso dos recursos da empresa, a jornada de trabalho, o controle de ponto e o banco de horas, além das regras de funcionamento da remuneração e dos benefícios oferecidos. O objetivo é que colaboradores e gestores tenham uma referência única e atualizada para consulta, evitando dúvidas e informações dispersas entre a Cartilha do Colaborador, comunicados e conversas informais.</p>\n<p>Esta política não substitui o Código de Conduta e Ética, que trata dos princípios éticos, de conduta profissional, confidencialidade, conflitos de interesse e medidas disciplinares. Aqui são tratadas apenas as regras operacionais de funcionamento do dia a dia — os dois documentos se complementam.</p>\n<h3>👥  ABRANGÊNCIA</h3>\n<p>Esta política se aplica a todos os colaboradores do quadro administrativo da Gestamg Gestão LTDA, em todas as filiais.</p>\n<p>Colaboradores da operação de coleta (motoristas de caminhão e coletores) seguem, adicionalmente, as políticas internas próprias de sua função — como a Política Interna do Motorista —, que tratam das regras específicas da rotina operacional de campo e não são substituídas por esta política.</p>\n<h3>🖥️  USO DE RECURSOS DA EMPRESA</h3>\n<p>Computador e internet: O uso é restrito a atividades profissionais. É proibido acessar sites impróprios ou sem relação com o trabalho durante o expediente.</p>\n<p>Telefone: As ligações devem ser curtas e voltadas ao trabalho. O uso pessoal é permitido apenas nos horários de almoço e de lanche.</p>\n<p>Sala de reunião: O uso da sala de reunião exige agendamento prévio. Ao final, mantenha o espaço organizado e evite atrapalhar outras atividades em andamento.</p>\n<h3>🕐  JORNADA, PONTO E BANCO DE HORAS</h3>\n<p>Jornada de trabalho:</p>\n<p>•  Segunda a quinta: 07h30 às 17h30</p>\n<p>•  Sexta: 07h30 às 16h30</p>\n<p>Atrasos ou ausências devem ser comunicados com antecedência.</p>\n<p>Intervalo para lanche: 15 minutos para lanche, a partir das 15h00.</p>\n<p>Registro de ponto: O registro é feito pelo aplicativo Sólides, com o PIN individual de cada colaborador.</p>\n<p>Esquecimento de ponto: O colaborador é responsável pelo próprio fechamento de ponto. Em caso de esquecimento, deve lançar o registro em atraso para aprovação do Departamento Pessoal.</p>\n<p>Banco de horas: O banco de horas é semestral. Os saldos positivos não são pagos — o colaborador deve tirar a folga correspondente — e os saldos negativos são descontados. A empresa trabalha para que todos encerrem o período com o saldo zerado.</p>\n<p>Atestado médico: Deve ser apresentado ao Departamento Pessoal em até 48 horas a partir da data do afastamento, ou enviado pelo WhatsApp o quanto antes.</p>\n<h3>💰  REMUNERAÇÃO E BENEFÍCIOS — REGRAS DE FUNCIONAMENTO</h3>\n<p>Salário: Pago até o 5º dia útil do mês, em conta bancária do Banco do Brasil. É possível solicitar adiantamento opcional de 25% do salário, mediante solicitação ao Departamento Pessoal.</p>\n<p>Cartão Alimentação: Valor de R$ 23,00 por dia efetivamente trabalhado, conforme a Convenção Coletiva de Trabalho (CCT) vigente. O crédito é feito no cartão benefício da Sólides, entregue no início da jornada do colaborador.</p>\n<div class=\"caixa caixa-atencao\"><span class=\"caixa-icone\">!</span><span>Perda do benefício  O benefício não é devido em dias de férias, faltas (justificadas ou não), afastamentos — com ou sem atestado —, licença-maternidade, doença ou benefício previdenciário, conforme a CCT. As regras completas de apuração dia a dia estão nas Regras de Concessão do Cartão Alimentação, documento específico para esse tema.</span></div>\n<p>Plano de Saúde: A adesão é facultativa. Atualmente, a empresa custeia 100% da mensalidade do plano para o colaborador titular. Quando há utilização do plano, o custo gerado (coparticipação) é descontado em folha de pagamento. É possível incluir dependentes, com a mensalidade e a eventual coparticipação referentes a eles descontadas integralmente do colaborador em folha. A forma de custeio pela empresa pode variar por colaborador, sempre dentro do que estabelece a CCT vigente.</p>\n<p>Plano Odontológico (OdontoPrev): A empresa oferece plano odontológico sem coparticipação para o colaborador titular. A adesão é facultativa. É possível incluir dependentes, mediante custeio assumido pelo colaborador.</p>\n<p>Cartão Farmácia: Sem taxa de adesão; as compras realizadas são descontadas em folha de pagamento.</p>\n<p>Seguro de Vida: Apólice em grupo, com subsídio de 100% do valor pela empresa.</p>\n<p>Vale-Transporte: Benefício opcional para deslocamento entre residência e trabalho. O desconto é de até 6% do salário-base, limitado ao valor efetivamente utilizado.</p>\n<p>TotalPass: Acesso a academias e diversas modalidades esportivas por meio da parceria mantida pela empresa.</p>\n<p>Substituição ou acúmulo de função: O colaborador que substitui um colega ou acumula outra função por período superior a 7 dias — por exemplo, ao cobrir as férias de um colega — tem direito a um complemento remuneratório de 20% sobre o salário da função substituída ou acumulada, proporcional ao período da tarefa, sem exceder o salário do substituído, conforme a CCT. A escolha do colaborador responsável pela substituição ou cobertura é definida pelo gestor da unidade, alinhada previamente com o Departamento Pessoal, e deve recair sobre apenas 1 colaborador a cada momento da ausência — nunca dois colaboradores cobrindo simultaneamente a mesma função. Em ausências mais longas, para evitar sobrecarga em uma única pessoa, o gestor pode dividir o período entre dois colaboradores em sequência (ex: 10 dias com um colaborador e os 5 dias restantes com outro), cada um recebendo o complemento remuneratório proporcional apenas aos dias em que efetivamente exerceu a cobertura — essa divisão sequencial não exige justificativa especial. Já a cobertura simultânea por mais de um colaborador na mesma função e período — com pagamento do complemento a ambos ao mesmo tempo — só é aceita em caráter excepcional, mediante justificativa do gestor e aprovação prévia do Departamento Pessoal.</p>\n<p>Plano de Cargos e Salários: Os critérios de estrutura salarial e progressão de carreira estão descritos na Política de Cargos e Salários da Gestamg, documento específico para esse tema.</p>\n<div class=\"caixa caixa-pendencia\"><span class=\"caixa-icone\">P</span><span>Pendência  Ainda não está definido se o documento da Política de Cargos e Salários fica disponível para consulta de todos os colaboradores ou apenas para a diretoria. Este ponto será esclarecido em uma próxima atualização.</span></div>\n<p>Em caso de dúvidas sobre qualquer ponto desta política, procure o Departamento Pessoal.</p>",

  "html": "<p>Este documento explica, de forma direta, como funciona a concessão do Cartão Alimentação: quando o colaborador tem direito ao crédito do dia e quando não tem. O objetivo é padronizar o entendimento em todas as unidades e evitar dúvidas entre gestores e colaboradores.</p>\n<h3>🍽️  COMO FUNCIONA</h3>\n<p>O Cartão Alimentação cobre o custo de refeições feitas pelo colaborador durante a jornada de trabalho. O crédito é apurado dia a dia: só é concedido nos dias em que há comparecimento efetivo ao trabalho.</p>\n<h3>✅  QUANDO HÁ DIREITO AO CRÉDITO DO DIA</h3>\n<p>Dia trabalhado normalmente: O colaborador compareceu ao trabalho no dia — tem direito à diária correspondente.</p>\n<p>Comparecimento parcial: Mesmo que o colaborador se ausente antes do horário previsto por motivo pessoal, o comparecimento no dia já garante o direito à diária.</p>\n<p>Home office ou trabalho externo autorizado: Quando formalmente autorizado pela empresa, conta como comparecimento efetivo — gera direito à diária normalmente.</p>\n<p>Compensação de horas em sábado ou outro dia não útil: Gera direito à diária referente a esse dia, por se tratar de jornada adicional — mas não recupera a diária do dia da falta original (ver nota abaixo).</p>\n<div class=\"caixa caixa-atencao\"><span class=\"caixa-icone\">!</span><span>Atenção —  compensar uma falta em dia útil normal (segunda a sexta) não gera diária extra, porque esses dias já são dias de trabalho regular, com diária própria. A diária extra só existe quando a compensação acontece num dia que normalmente não seria trabalhado, como um sábado.</span></div>\n<h3>❌  QUANDO NÃO HÁ DIREITO AO CRÉDITO DO DIA</h3>\n<p>Falta, justificada ou não: Não há direito à diária do dia, mesmo com atestado médico, licença legal, luto ou convocação judicial. O abono pode garantir a remuneração do dia, mas não a diária — como não houve comparecimento, não houve o gasto com alimentação que o benefício cobre.</p>\n<p>Férias, feriados e DSR sem convocação: Não há jornada a cumprir nesses dias, logo não há diária.</p>\n<p>Afastamento por auxílio-doença ou outro benefício previdenciário: Segue o que estiver previsto na Convenção Coletiva de Trabalho (CCT), quando ela definir uma regra mais benéfica que esta.</p>\n<h3>💰  VALOR E CÁLCULO</h3>\n<p>Valor por dia: R$ 23,00 por dia de comparecimento efetivo, podendo ser reajustado por decisão da empresa ou por previsão em norma coletiva.</p>\n<p>Apuração: Mensal, com base nos registros do ponto — número de dias com comparecimento efetivo multiplicado pelo valor da diária vigente.</p>\n<p>Estas regras valem para todas as unidades da empresa e substituem qualquer entendimento anterior sobre o tema. Em caso de dúvidas, procure o Departamento Pessoal.</p>",
